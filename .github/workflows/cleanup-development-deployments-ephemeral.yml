name: Cleanup Development Deployments

on:
  push:
    branches:
      - main
    paths:
      - "ops/cleanup-development-deployments-trigger"

permissions:
  contents: read
  deployments: write

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Purge stale development deployment records
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          mapfile -t ids < <(
            gh api --paginate "repos/${repo}/deployments?environment=development&per_page=100" --jq '.[].id'
          )
          echo "development_deployments_found=${#ids[@]}"

          for id in "${ids[@]}"; do
            environment="$(gh api "repos/${repo}/deployments/${id}" --jq '.environment')"
            if [ "$environment" != "development" ]; then
              echo "Refusing to touch deployment ${id}: environment=${environment}" >&2
              exit 1
            fi

            gh api --method POST "repos/${repo}/deployments/${id}/statuses" \
              -f state=inactive \
              -f description='Retired temporary development deployment record' >/dev/null
            gh api --method DELETE "repos/${repo}/deployments/${id}" >/dev/null
          done

          remaining="$(
            gh api --paginate "repos/${repo}/deployments?environment=development&per_page=100" --jq '.[].id' | wc -l | tr -d ' '
          )"
          echo "development_deployments_remaining=${remaining}"
          test "$remaining" -eq 0
