name: Indicative Surface Diagnostic Ephemeral

on:
  push:
    branches:
      - research/indicative-surface-robustness
    paths:
      - ".github/workflows/indicative-surface-diagnostic-ephemeral.yml"

permissions:
  contents: read

jobs:
  surface-study:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: competition
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_COMPETITION_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_COMPETITION_SECRET_KEY }}
      CLOCKCROSS_ACCOUNT_ROLE: competition
      CLOCKCROSS_ALLOW_DEV_ORDER: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run read-only indicative surface robustness study
        shell: bash
        run: |
          mkdir -p artifacts/surface-study
          uv run python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta, timezone
          from decimal import Decimal
          from pathlib import Path

          from clockcross.alpaca.options import AlpacaOptionChainRestClient
          from clockcross.research.surface_robustness import evaluate_surface_robustness
          from clockcross.runtime import AlpacaPaperAccountRestClient, AlpacaPortfolioGateway
          from clockcross.trading.risk import RiskGovernor

          api_key = os.environ["ALPACA_API_KEY"]
          secret_key = os.environ["ALPACA_SECRET_KEY"]

          account_client = AlpacaPaperAccountRestClient(api_key, secret_key)
          portfolio = AlpacaPortfolioGateway(
              account_client,
              starting_equity=Decimal("100000"),
          ).current()
          max_net_debit = RiskGovernor().max_candidate_net_debit(portfolio)
          if max_net_debit <= 0:
              raise RuntimeError("existing risk envelope has no available one-contract debit budget")

          requested_at = datetime.now(timezone.utc)
          option_client = AlpacaOptionChainRestClient(api_key, secret_key)
          chain = option_client.fetch_chain(
              "COIN",
              feed="indicative",
              expiration_gte=requested_at.date() + timedelta(days=7),
              expiration_lte=requested_at.date() + timedelta(days=21),
          )
          study_now = chain.retrieved_at or datetime.now(timezone.utc)

          studies = {
              direction: evaluate_surface_robustness(
                  chain,
                  direction=direction,
                  now=study_now,
                  max_net_debit=max_net_debit,
                  trials=2000,
                  seed=20260901,
              )
              for direction in ("bullish", "bearish")
          }

          payload = {
              "study_type": "bounded indicative snapshot perturbation sensitivity",
              "feed": chain.feed,
              "retrieved_at": study_now.isoformat(),
              "contract_count": len(chain.contracts),
              "max_net_debit": str(max_net_debit),
              "risk_cap_dollars": str(max_net_debit * Decimal("100")),
              "trials_per_band_per_direction": 2000,
              "predeclared_interpretation": {
                  "hard_failure": "any risk_invariant_violations > 0",
                  "micro_candidate_rate_min": 0.95,
                  "small_candidate_rate_min": 0.90,
                  "micro_same_long_warning_below": 0.70,
                  "moderate_band": "descriptive only",
              },
              "studies": studies,
              "note": "Read-only diagnostic. No trading/execution client was instantiated and no order submission endpoint was called.",
          }

          output = Path("artifacts/surface-study/indicative-surface-robustness.json")
          output.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Upload research result
        uses: actions/upload-artifact@v4
        with:
          name: indicative-surface-robustness
          path: artifacts/surface-study/indicative-surface-robustness.json
          if-no-files-found: error
          retention-days: 5
