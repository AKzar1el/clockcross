name: Featherless Phase-2 Research

on:
  push:
    branches:
      - research/featherless-phase2-2026-09-04
    paths:
      - .github/workflows/featherless-phase2.yml
      - artifacts/research/featherless-phase2-protocol-2026-09-04.json
      - ops/featherless-phase2.py
      - ops/featherless_phase2/**
      - src/clockcross/research/featherless_phase2.py
      - tests/unit/test_featherless_phase2.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: competition
    env:
      LLM_BASE_URL: https://clockcross-ai-gateway.tomi-seregi99.workers.dev/v1
      LLM_MODEL: clockcross-cloudflare-llama-3.3-70b
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Verify required credentials without printing them
        shell: bash
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_COMPETITION_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_COMPETITION_SECRET_KEY }}
          FEATHERLESS_API_KEY: ${{ secrets.FEATHERLESS_API_KEY }}
          LLM_API_KEY: ${{ secrets.CLOCKCROSS_AI_GATEWAY_BEARER }}
        run: |
          set -euo pipefail
          for name in ALPACA_API_KEY ALPACA_SECRET_KEY FEATHERLESS_API_KEY LLM_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: ${name}" >&2
              exit 1
            fi
          done
      - name: Alpaca MCP runtime compatibility
        run: >-
          uv run --no-project
          --with "alpaca-mcp-server==2.2.0"
          --with "fastmcp==3.4.7"
          python -c "import alpaca_mcp_server.server; from fastmcp.tools.tool import ToolResult; assert ToolResult is not None"
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy src/clockcross
      - name: Tests
        run: uv run pytest -q
      - name: Run frozen read-only Phase-2 bakeoff
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_COMPETITION_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_COMPETITION_SECRET_KEY }}
          FEATHERLESS_API_KEY: ${{ secrets.FEATHERLESS_API_KEY }}
          LLM_API_KEY: ${{ secrets.CLOCKCROSS_AI_GATEWAY_BEARER }}
        run: >-
          uv run python ops/featherless-phase2.py
          --output artifacts/research/featherless-phase2-live-2026-09-04.json
      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: featherless-phase2-2026-09-04
          path: artifacts/research/featherless-phase2-live-2026-09-04.json
          if-no-files-found: warn
          retention-days: 30
