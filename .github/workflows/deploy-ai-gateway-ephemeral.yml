name: ClockCross AI gateway deploy ephemeral

on:
  push:
    branches:
      - feat/clockcross-core

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy authenticated Workers AI gateway
        shell: bash
        run: |
          set -euo pipefail
          AUTH="$(printf '%s' "${CLOUDFLARE_API_TOKEN}:clockcross-ai-gateway:v1" | sha256sum | cut -d' ' -f1)"
          echo "::add-mask::$AUTH"

          cd deploy/cloudflare-ai-gateway
          npx --yes wrangler@latest deploy --config wrangler.jsonc 2>&1 | tee /tmp/clockcross-ai-deploy.log
          printf '%s' "$AUTH" | npx --yes wrangler@latest secret put CLOCKCROSS_AI_AUTH --config wrangler.jsonc 2>&1 | tee /tmp/clockcross-ai-secret.log

          url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/clockcross-ai-deploy.log | tail -1 || true)"
          if [ -z "$url" ]; then
            echo "Gateway URL was not discovered from Wrangler output" >&2
            exit 1
          fi
          echo "CLOCKCROSS_AI_GATEWAY_URL=$url"

          health_ok=false
          for attempt in $(seq 1 30); do
            http="$(curl -sS -o /tmp/health.json -w '%{http_code}' "$url/health" || true)"
            if [ "$http" = "200" ]; then
              health_ok=true
              break
            fi
            sleep 2
          done
          echo "CLOCKCROSS_AI_HEALTH=$health_ok"
          if [ "$health_ok" != "true" ]; then
            exit 1
          fi

          cat > /tmp/decision-request.json <<'JSON'
          {
            "model": "clockcross-cloudflare-llama-3.3-70b",
            "messages": [
              {"role":"system","content":"Return a conservative ClockCross decision using the required JSON fields only."},
              {"role":"user","content":"COIN residual +1.5%, BTC +2%, no company-specific news. Choose continuation, reversion, or abstain."}
            ]
          }
          JSON

          auth_ok=false
          for attempt in $(seq 1 20); do
            http="$(curl -sS -o /tmp/decision.json -w '%{http_code}' \
              -H "Authorization: Bearer $AUTH" \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/decision-request.json \
              "$url/v1/chat/completions" || true)"
            if [ "$http" = "200" ]; then
              auth_ok=true
              break
            fi
            sleep 2
          done
          echo "CLOCKCROSS_AI_AUTHENTICATED_CALL=$auth_ok"
          if [ "$auth_ok" != "true" ]; then
            cat /tmp/decision.json 2>/dev/null || true
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/decision.json').read_text())
          content = payload['choices'][0]['message']['content']
          decision = json.loads(content)
          required = {'action','confidence','idiosyncratic_news_detected','driver','reason'}
          ok = set(decision) == required and decision['action'] in {'continuation','reversion','abstain'}
          print(json.dumps({'gateway_openai_shape': True, 'gateway_decision_schema': ok}, sort_keys=True))
          if not ok:
              raise SystemExit(1)
          PY
