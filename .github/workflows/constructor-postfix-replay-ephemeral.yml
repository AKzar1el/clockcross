name: Constructor Post-Fix Replay Ephemeral

on:
  push:
    branches:
      - research/monthly-end-to-end-backtest
    paths:
      - ".github/workflows/constructor-postfix-replay-ephemeral.yml"

permissions:
  contents: read

env:
  ALPACA_API_KEY: ${{ secrets.ALPACA_COMPETITION_API_KEY }}
  ALPACA_SECRET_KEY: ${{ secrets.ALPACA_COMPETITION_SECRET_KEY }}
  CLOCKCROSS_ACCOUNT_ROLE: competition
  CLOCKCROSS_ALLOW_DEV_ORDER: "false"

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: competition
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Replay actual constructor default on five recent signal days
        shell: bash
        run: |
          mkdir -p artifacts/monthly-backtest
          uv run python - <<'PY'
          import json, math
          from datetime import date, datetime, time, timedelta
          from decimal import Decimal
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import httpx, numpy as np
          from clockcross.alpaca.historical import AlpacaRestHistoryClient
          from clockcross.alpaca.options import OptionChainSnapshot, OptionContractSnapshot
          from clockcross.config import Settings
          from clockcross.trading.constructor import ConstructionPolicy, construct_vertical
          from clockcross.trading.risk import RiskPolicy

          ET=ZoneInfo("America/New_York"); UTC=ZoneInfo("UTC"); R=0.04
          DAYS=[date(2026,8,7),date(2026,8,18),date(2026,8,21),date(2026,8,24),date(2026,9,1)]
          settings=Settings(); headers={"APCA-API-KEY-ID":settings.alpaca_api_key,"APCA-API-SECRET-KEY":settings.alpaca_secret_key}; http=httpx.Client(timeout=30.0); stock=AlpacaRestHistoryClient(settings.alpaca_api_key,settings.alpaca_secret_key)
          max_debit=settings.competition_starting_equity*RiskPolicy().per_position_loss_fraction/Decimal("100")
          policy=ConstructionPolicy(max_net_debit=max_debit)
          def ud(d,h,m):return datetime.combine(d,time(h,m),tzinfo=ET).astimezone(UTC)
          def ncdf(x):return .5*(1+math.erf(x/math.sqrt(2)))
          def call(s,k,t,v):
              if t<=0 or v<=0:return max(0,s-k)
              d1=(math.log(s/k)+(R+.5*v*v)*t)/(v*math.sqrt(t));d2=d1-v*math.sqrt(t);return s*ncdf(d1)-k*math.exp(-R*t)*ncdf(d2)
          def delta_proxy(p,s,k,t):
              intrinsic=max(0,s-k*math.exp(-R*t))
              if not (p>intrinsic and p<s):return None
              lo,hi=.01,5.0
              if call(s,k,t,hi)<p:return None
              for _ in range(70):
                  mid=(lo+hi)/2
                  if call(s,k,t,mid)<p:lo=mid
                  else:hi=mid
              v=(lo+hi)/2;d1=(math.log(s/k)+(R+.5*v*v)*t)/(v*math.sqrt(t));return ncdf(d1)
          def spot(d):
              rows=stock.fetch_stock_bars("COIN",ud(d,9,54),ud(d,9,57),feed="sip"); key=ud(d,9,55).strftime("%Y-%m-%dT%H:%M");return next(float(x["open"]) for x in rows if str(x["timestamp"]).startswith(key))
          def contracts(d,s):
              out={}
              for status in ("active","inactive"):
                  token=None
                  while True:
                      p={"underlying_symbols":"COIN","status":status,"expiration_date_gte":(d+timedelta(days=7)).isoformat(),"expiration_date_lte":(d+timedelta(days=21)).isoformat(),"strike_price_gte":f"{s*.65:.2f}","strike_price_lte":f"{s*1.45:.2f}","type":"call","limit":10000}
                      if token:p["page_token"]=token
                      r=http.get("https://paper-api.alpaca.markets/v2/options/contracts",params=p,headers=headers);r.raise_for_status();z=r.json()
                      for x in z.get("option_contracts",[]):out[x["symbol"]]=x
                      token=z.get("next_page_token")
                      if not token:break
              return list(out.values())
          def bars(syms,d):
              out={}
              for off in range(0,len(syms),100):
                  chunk=syms[off:off+100];token=None
                  while True:
                      p={"symbols":",".join(chunk),"timeframe":"1Min","start":ud(d,9,40).isoformat().replace("+00:00","Z"),"end":ud(d,11,0).isoformat().replace("+00:00","Z"),"limit":10000,"sort":"asc"}
                      if token:p["page_token"]=token
                      r=http.get("https://data.alpaca.markets/v1beta1/options/bars",params=p,headers=headers);r.raise_for_status();z=r.json();raw=z.get("bars",{})
                      if isinstance(raw,dict):
                          for sym,items in raw.items():out.setdefault(sym,[]).extend(items)
                      token=z.get("next_page_token")
                      if not token:break
              return out
          def et(x):return datetime.fromisoformat(x["t"].replace("Z","+00:00")).astimezone(ET)
          def pick(items,start,end,first):
              c=[x for x in items if start<=et(x).time().replace(tzinfo=None)<=end]
              if not c:return None
              return (min if first else max)(c,key=et)

          rows=[]
          for d in DAYS:
              s=spot(d);cs=contracts(d,s);bb=bars([x["symbol"] for x in cs],d);decision=ud(d,9,55);synthetic=[]
              for x in cs:
                  pre=pick(bb.get(x["symbol"],[]),time(9,40),time(9,55),False)
                  if pre is None:continue
                  k=float(x["strike_price"]);exp=date.fromisoformat(x["expiration_date"]);T=max((datetime.combine(exp,time(16),tzinfo=ET).astimezone(UTC)-decision).total_seconds(),1)/(365*24*3600);delta=delta_proxy(float(pre["c"]),s,k,T)
                  if delta is None:continue
                  p=Decimal(str(float(pre["c"])))
                  synthetic.append(OptionContractSnapshot(symbol=x["symbol"],underlying="COIN",expiration=exp,strike=Decimal(str(k)),option_type="call",bid=p,ask=p,quote_timestamp=decision,delta=Decimal(str(delta))))
              cand=construct_vertical(OptionChainSnapshot(underlying="COIN",feed="indicative",contracts=synthetic,retrieved_at=decision),direction="bullish",now=decision,policy=policy)
              if cand is None:
                  rows.append({"date":d.isoformat(),"spot":s,"status":"no_candidate"});continue
              ls,ss=cand.long_leg.symbol,cand.short_leg.symbol;le=pick(bb.get(ls,[]),time(9,55),time(10,5),True);se=pick(bb.get(ss,[]),time(9,55),time(10,5),True);lx=pick(bb.get(ls,[]),time(10,50),time(10,55),False);sx=pick(bb.get(ss,[]),time(10,50),time(10,55),False)
              row={"date":d.isoformat(),"spot":s,"status":"selected","long":ls,"short":ss,"long_strike":float(cand.metadata["long_strike"]),"short_strike":float(cand.metadata["short_strike"]),"width":float(cand.metadata["short_strike"])-float(cand.metadata["long_strike"]),"long_delta":float(cand.metadata["long_delta"]),"short_abs_delta":float(cand.metadata["short_abs_delta"]),"net_delta":float(cand.metadata["net_delta"]),"proxy_debit":float(cand.net_debit),"entry_trade_coverage":le is not None and se is not None,"exit_trade_coverage":lx is not None and sx is not None}
              if all((le,se,lx,sx)):
                  entry=float(le["c"])-float(se["c"]);exitv=float(lx["c"])-float(sx["c"]);row["entry_value"]=entry;row["exit_value"]=exitv
                  if 0<entry<row["width"]:
                      row["raw_pnl_dollars_one_contract"]=(exitv-entry)*100;row["friction_0.20_pnl"]=(exitv-entry-.20)*100
              rows.append(row)
          selected=[r for r in rows if r["status"]=="selected"]
          payload={"study":"postfix_actual_constructor_historical_proxy","production_min_short_abs_delta":float(policy.min_short_abs_delta),"selected_count":len(selected),"entry_trade_coverage_rate":sum(r["entry_trade_coverage"] for r in selected)/len(selected) if selected else None,"exit_trade_coverage_rate":sum(r["exit_trade_coverage"] for r in selected)/len(selected) if selected else None,"mean_width":float(np.mean([r["width"] for r in selected])) if selected else None,"mean_net_delta":float(np.mean([r["net_delta"] for r in selected])) if selected else None,"rows":rows,"limitations":["Historical bid/ask and Greeks are unavailable at arbitrary past decision timestamps; this uses pre-decision trade prices and Black-Scholes delta proxies.","Trade-print coverage is a liquidity proxy, not proof of executable historical quote fillability."]}
          Path("artifacts/monthly-backtest/constructor-postfix-replay.json").write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n");print(json.dumps(payload,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: constructor-postfix-replay
          path: artifacts/monthly-backtest/constructor-postfix-replay.json
          if-no-files-found: error
          retention-days: 5
