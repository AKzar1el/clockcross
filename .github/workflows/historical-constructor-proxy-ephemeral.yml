name: Historical Constructor Proxy Ephemeral

on:
  push:
    branches:
      - research/monthly-end-to-end-backtest
    paths:
      - ".github/workflows/historical-constructor-proxy-ephemeral.yml"

permissions:
  contents: read

env:
  ALPACA_API_KEY: ${{ secrets.ALPACA_COMPETITION_API_KEY }}
  ALPACA_SECRET_KEY: ${{ secrets.ALPACA_COMPETITION_SECRET_KEY }}
  CLOCKCROSS_ACCOUNT_ROLE: competition
  CLOCKCROSS_ALLOW_DEV_ORDER: "false"

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: competition
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Replay current constructor with pre-decision print-implied deltas
        shell: bash
        run: |
          mkdir -p artifacts/monthly-backtest
          uv run python - <<'PY'
          import json
          import math
          from datetime import date, datetime, time, timedelta
          from decimal import Decimal
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import httpx
          import numpy as np

          from clockcross.alpaca.historical import AlpacaRestHistoryClient
          from clockcross.alpaca.options import OptionChainSnapshot, OptionContractSnapshot
          from clockcross.config import Settings
          from clockcross.trading.constructor import ConstructionPolicy, construct_vertical
          from clockcross.trading.risk import RiskPolicy

          ET = ZoneInfo("America/New_York")
          UTC = ZoneInfo("UTC")
          DAYS = [date(2026,8,7), date(2026,8,18), date(2026,8,21), date(2026,8,24), date(2026,9,1)]
          RISK_FREE = 0.04
          settings = Settings()
          max_debit = settings.competition_starting_equity * RiskPolicy().per_position_loss_fraction / Decimal("100")
          headers={"APCA-API-KEY-ID":settings.alpaca_api_key,"APCA-API-SECRET-KEY":settings.alpaca_secret_key}
          http=httpx.Client(timeout=30.0)
          stock=AlpacaRestHistoryClient(settings.alpaca_api_key,settings.alpaca_secret_key)

          def utc_dt(day,hh,mm): return datetime.combine(day,time(hh,mm),tzinfo=ET).astimezone(UTC)
          def norm_cdf(x): return 0.5*(1.0+math.erf(x/math.sqrt(2.0)))
          def bs_call(s,k,t,r,sigma):
              if t<=0 or sigma<=0: return max(0.0,s-k)
              d1=(math.log(s/k)+(r+0.5*sigma*sigma)*t)/(sigma*math.sqrt(t)); d2=d1-sigma*math.sqrt(t)
              return s*norm_cdf(d1)-k*math.exp(-r*t)*norm_cdf(d2)
          def infer_iv_delta(price,s,k,t,r=RISK_FREE):
              intrinsic=max(0.0,s-k*math.exp(-r*t))
              if not (price>intrinsic and price<s): return None
              lo,hi=0.01,5.0
              if bs_call(s,k,t,r,hi)<price: return None
              for _ in range(80):
                  mid=(lo+hi)/2.0
                  if bs_call(s,k,t,r,mid)<price: lo=mid
                  else: hi=mid
              sigma=(lo+hi)/2.0
              d1=(math.log(s/k)+(r+0.5*sigma*sigma)*t)/(sigma*math.sqrt(t))
              return sigma,norm_cdf(d1)
          def spot(day):
              rows=stock.fetch_stock_bars("COIN",utc_dt(day,9,54),utc_dt(day,9,57),feed="sip")
              key=utc_dt(day,9,55).strftime("%Y-%m-%dT%H:%M")
              return next(float(x["open"]) for x in rows if str(x["timestamp"]).startswith(key))
          def contracts(day,s):
              out={}
              for status in ("active","inactive"):
                  token=None
                  while True:
                      p={"underlying_symbols":"COIN","status":status,"expiration_date_gte":(day+timedelta(days=7)).isoformat(),"expiration_date_lte":(day+timedelta(days=21)).isoformat(),"strike_price_gte":f"{s*0.65:.2f}","strike_price_lte":f"{s*1.45:.2f}","type":"call","limit":10000}
                      if token: p["page_token"]=token
                      r=http.get("https://paper-api.alpaca.markets/v2/options/contracts",params=p,headers=headers); r.raise_for_status(); data=r.json()
                      for x in data.get("option_contracts",[]): out[x["symbol"]]=x
                      token=data.get("next_page_token")
                      if not token: break
              return list(out.values())
          def bars(symbols,day):
              merged={}
              for off in range(0,len(symbols),100):
                  chunk=symbols[off:off+100]; token=None
                  while True:
                      p={"symbols":",".join(chunk),"timeframe":"1Min","start":utc_dt(day,9,40).isoformat().replace("+00:00","Z"),"end":utc_dt(day,11,0).isoformat().replace("+00:00","Z"),"limit":10000,"sort":"asc"}
                      if token: p["page_token"]=token
                      r=http.get("https://data.alpaca.markets/v1beta1/options/bars",params=p,headers=headers); r.raise_for_status(); data=r.json(); raw=data.get("bars",{})
                      if isinstance(raw,dict):
                          for sym,items in raw.items(): merged.setdefault(sym,[]).extend(items)
                      token=data.get("next_page_token")
                      if not token: break
              return merged
          def et(raw): return datetime.fromisoformat(raw["t"].replace("Z","+00:00")).astimezone(ET)
          def last_pre(items):
              c=[x for x in items if time(9,40)<=et(x).time().replace(tzinfo=None)<=time(9,55)]
              return max(c,key=et) if c else None
          def first_entry(items):
              c=[x for x in items if time(9,55)<=et(x).time().replace(tzinfo=None)<=time(10,5)]
              return min(c,key=et) if c else None
          def last_exit(items):
              c=[x for x in items if time(10,50)<=et(x).time().replace(tzinfo=None)<=time(10,55)]
              return max(c,key=et) if c else None

          results=[]; pnls=[]; rois=[]
          for day in DAYS:
              s=spot(day); raw_contracts=contracts(day,s); raw_bars=bars([x["symbol"] for x in raw_contracts],day)
              decision=utc_dt(day,9,55)
              synthetic=[]; diagnostics=[]
              for x in raw_contracts:
                  sym=x["symbol"]; pre=last_pre(raw_bars.get(sym,[]))
                  if pre is None: continue
                  strike=float(x["strike_price"]); expiry=date.fromisoformat(x["expiration_date"])
                  expiry_close=datetime.combine(expiry,time(16,0),tzinfo=ET).astimezone(UTC)
                  t=max((expiry_close-decision).total_seconds(),1.0)/(365.0*24*3600)
                  inferred=infer_iv_delta(float(pre["c"]),s,strike,t)
                  if inferred is None: continue
                  iv,delta=inferred
                  # Historical bid/ask is unavailable: use the last pre-decision trade as a zero-width quote proxy.
                  synthetic.append(OptionContractSnapshot(
                      symbol=sym,underlying="COIN",expiration=expiry,strike=Decimal(str(strike)),option_type="call",
                      bid=Decimal(str(float(pre["c"]))),ask=Decimal(str(float(pre["c"]))),quote_timestamp=decision,
                      delta=Decimal(str(delta)),volume=int(pre.get("v",0)) if pre.get("v") is not None else None,
                  ))
                  diagnostics.append({"symbol":sym,"strike":strike,"expiration":expiry.isoformat(),"pre_price":float(pre["c"]),"pre_trade_time":et(pre).isoformat(),"iv_proxy":iv,"delta_proxy":delta})
              chain=OptionChainSnapshot(underlying="COIN",feed="indicative",contracts=synthetic,retrieved_at=decision)
              candidate=construct_vertical(chain,direction="bullish",now=decision,policy=ConstructionPolicy(max_net_debit=max_debit))
              row={"date":day.isoformat(),"spot_0955":s,"raw_contract_count":len(raw_contracts),"predecision_priced_contract_count":len(synthetic),"max_net_debit":float(max_debit)}
              if candidate is None:
                  row["status"]="no_proxy_candidate"; results.append(row); continue
              long_sym=candidate.long_leg.symbol; short_sym=candidate.short_leg.symbol
              le=first_entry(raw_bars.get(long_sym,[])); se=first_entry(raw_bars.get(short_sym,[])); lx=last_exit(raw_bars.get(long_sym,[])); sx=last_exit(raw_bars.get(short_sym,[]))
              row.update({"status":"selected","candidate":candidate.model_dump(mode="json"),"long_entry":None if le is None else {"price":float(le["c"]),"time":et(le).isoformat()},"short_entry":None if se is None else {"price":float(se["c"]),"time":et(se).isoformat()},"long_exit":None if lx is None else {"price":float(lx["c"]),"time":et(lx).isoformat()},"short_exit":None if sx is None else {"price":float(sx["c"]),"time":et(sx).isoformat()}})
              bysym={d["symbol"]:d for d in diagnostics}; row["long_proxy"] = bysym.get(long_sym); row["short_proxy"] = bysym.get(short_sym)
              if all((le,se,lx,sx)):
                  entry=float(le["c"])-float(se["c"]); exitv=float(lx["c"])-float(sx["c"])
                  row["execution_entry_spread_value"]=entry; row["exit_spread_value"]=exitv
                  if 0<entry<float(abs(float(bysym[short_sym]["strike"])-float(bysym[long_sym]["strike"]))):
                      pnl=(exitv-entry)*100.0; roi=(exitv-entry)/entry
                      row["raw_pnl_dollars_one_contract"]=pnl; row["raw_return_on_debit"]=roi
                      row["friction"]={f"{f:.2f}":{"pnl_dollars_one_contract":pnl-f*100.0,"return_on_debit":roi-f/entry} for f in (0.10,0.20,0.30)}
                      pnls.append(pnl); rois.append(roi)
                  else: row["pricing_status"]="invalid_asynchronous_execution_debit"
              else: row["pricing_status"]="selected_pair_lacks_postdecision_or_exit_trade_bar"
              results.append(row)

          def stats(vals):
              if not vals:return {"count":0,"mean":None,"median":None,"hit_rate":None,"sum":0.0}
              a=np.asarray(vals,float);return {"count":int(a.size),"mean":float(a.mean()),"median":float(np.median(a)),"hit_rate":float((a>0).mean()),"sum":float(a.sum()),"wins":int((a>0).sum()),"losses":int((a<0).sum())}
          payload={
              "study":"current_constructor_historical_print_proxy",
              "signal_days":[d.isoformat() for d in DAYS],
              "direction":"bullish per current production-context AI replay assumption",
              "risk_free_rate_proxy":RISK_FREE,
              "risk_max_net_debit":float(max_debit),
              "selection":"actual current construct_vertical; synthetic bid=ask=last pre-09:55 trade and Black-Scholes delta inferred from that trade",
              "lookahead":"candidate selection uses only option prints at or before 09:55; post-09:55 and 10:50-10:55 prints are used only to price the already-selected pair",
              "limitations":[
                  "Historical Alpaca option snapshots do not expose arbitrary-past quote bid/ask or Greeks, so quote spread is unavailable and delta is a Black-Scholes proxy.",
                  "Historical option OHLC bars are trade-based; entry/exit spread values can be distorted by asynchronous leg prints and are not executable bid/ask marks.",
                  "A fixed 4% risk-free-rate proxy is used for IV/delta inference; COIN currently pays no cash dividend.",
              ],
              "raw_pnl_stats":stats(pnls),"raw_return_on_debit_stats":stats(rois),"days":results,
          }
          Path("artifacts/monthly-backtest/historical-constructor-proxy.json").write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n")
          print(json.dumps(payload,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: historical-constructor-proxy
          path: artifacts/monthly-backtest/historical-constructor-proxy.json
          if-no-files-found: error
          retention-days: 5
