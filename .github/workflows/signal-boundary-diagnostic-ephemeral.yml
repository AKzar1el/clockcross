name: Signal Boundary Diagnostic Ephemeral

on:
  push:
    branches:
      - research/signal-boundary-robustness
    paths:
      - ".github/workflows/signal-boundary-diagnostic-ephemeral.yml"

permissions:
  contents: read

jobs:
  boundary-study:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: competition
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_COMPETITION_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_COMPETITION_SECRET_KEY }}
      CLOCKCROSS_ACCOUNT_ROLE: competition
      CLOCKCROSS_ALLOW_DEV_ORDER: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run frozen signal-boundary study
        shell: bash
        run: |
          mkdir -p artifacts/boundary-study
          uv run python - <<'PY'
          import json
          from datetime import date, datetime, time, timezone
          from pathlib import Path

          import pandas as pd

          from clockcross.alpaca.historical import AlpacaRestHistoryClient, HistoricalDataGateway
          from clockcross.config import Settings
          from clockcross.research.episodes import build_episode_frame
          from clockcross.research.signal_boundary import evaluate_threshold_boundary_robustness

          settings = Settings()
          rest = AlpacaRestHistoryClient(
              settings.alpaca_api_key,
              settings.alpaca_secret_key,
              base_url=str(settings.alpaca_data_base_url),
          )
          gateway = HistoricalDataGateway(
              stock_fetcher=lambda symbol, begin, finish: rest.fetch_stock_bars(
                  symbol,
                  begin,
                  finish,
                  feed=settings.historical_stock_feed,
              ),
              crypto_fetcher=lambda symbol, begin, finish: rest.fetch_crypto_bars(
                  symbol,
                  begin,
                  finish,
              ),
              cache_root=None,
              stock_feed=settings.historical_stock_feed,
          )

          history_start = date(2024, 10, 1)
          research_start = date(2025, 1, 2)
          research_end = date(2026, 8, 28)
          external_day = date(2026, 9, 1)
          begin = datetime.combine(history_start, time.min, tzinfo=timezone.utc)
          finish = datetime(2026, 9, 1, 16, 0, tzinfo=timezone.utc)
          btc = gateway.fetch_crypto_minutes("BTC/USD", begin, finish)
          coin = gateway.fetch_stock_minutes("COIN", begin, finish)
          sessions = [
              ts.date()
              for ts in pd.date_range(start=history_start, end=external_day, freq="B")
          ]
          frame = build_episode_frame(
              btc,
              coin,
              sessions=sessions,
              beta_lookback=40,
          )

          research_frame = frame.loc[
              (frame["session_date"] >= research_start)
              & (frame["session_date"] <= research_end)
          ].copy()
          study = evaluate_threshold_boundary_robustness(
              research_frame,
              min_signal_count=20,
          )

          external = None
          external_rows = frame.loc[frame["session_date"] == external_day]
          if not external_rows.empty:
              row = external_rows.iloc[-1]
              residual = float(row["residual"])
              external = {
                  "session_date": external_day.isoformat(),
                  "training_count": int(row["training_count"]),
                  "residual": residual,
                  "absolute_residual": abs(residual),
                  "passes_thresholds": {
                      f"{threshold:.3f}": abs(residual) >= threshold
                      for threshold in (0.008, 0.009, 0.010, 0.011, 0.012)
                  },
                  "note": "External-only; excluded from boundary assessment.",
              }

          payload = {
              "study_type": "frozen 1pct residual boundary robustness",
              "history_start": history_start.isoformat(),
              "research_sample_start": research_start.isoformat(),
              "research_sample_end": research_end.isoformat(),
              "historical_stock_feed": settings.historical_stock_feed,
              "study": study,
              "sep1_external": external,
              "note": "Read-only historical study. No trading/execution client was instantiated and no order endpoint was called.",
          }
          output = Path("artifacts/boundary-study/signal-boundary-robustness.json")
          output.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Upload research result
        uses: actions/upload-artifact@v4
        with:
          name: signal-boundary-robustness
          path: artifacts/boundary-study/signal-boundary-robustness.json
          if-no-files-found: error
          retention-days: 5
