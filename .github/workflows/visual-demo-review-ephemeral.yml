name: ClockCross demo visual review ephemeral

on:
  push:
    branches:
      - feat/clockcross-core

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Render desktop and mobile screenshots
        shell: bash
        run: |
          set -euo pipefail
          cd deploy/cloudflare-demo/public
          python3 -m http.server 8123 >/tmp/clockcross-demo-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8123/ >/dev/null; then break; fi
            sleep 1
          done
          cd - >/dev/null
          mkdir -p /tmp/clockcross-review
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1600,1000" --full-page http://127.0.0.1:8123/#evidence /tmp/clockcross-review/desktop.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --full-page http://127.0.0.1:8123/#evidence /tmp/clockcross-review/mobile.png
      - uses: actions/upload-artifact@v4
        with:
          name: clockcross-demo-visual-review
          path: /tmp/clockcross-review/*.png
          if-no-files-found: error
          retention-days: 1
