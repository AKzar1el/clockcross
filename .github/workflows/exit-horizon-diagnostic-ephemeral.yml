name: Exit Horizon Diagnostic Ephemeral

on:
  push:
    branches:
      - research/exit-horizon-sensitivity
    paths:
      - ".github/workflows/exit-horizon-diagnostic-ephemeral.yml"

permissions:
  contents: read

jobs:
  horizon-study:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: competition
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_COMPETITION_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_COMPETITION_SECRET_KEY }}
      CLOCKCROSS_ACCOUNT_ROLE: competition
      CLOCKCROSS_ALLOW_DEV_ORDER: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run frozen exit-horizon study
        shell: bash
        run: |
          mkdir -p artifacts/horizon-study
          uv run python - <<'PY'
          import json
          from datetime import date, datetime, time, timezone
          from pathlib import Path

          import numpy as np
          import pandas as pd

          from clockcross.alpaca.historical import AlpacaRestHistoryClient, HistoricalDataGateway
          from clockcross.config import Settings
          from clockcross.research.episodes import build_episode_frame
          from clockcross.research.validation import evaluate_frozen_horizon_sensitivity

          settings = Settings()
          rest = AlpacaRestHistoryClient(
              settings.alpaca_api_key,
              settings.alpaca_secret_key,
              base_url=str(settings.alpaca_data_base_url),
          )
          gateway = HistoricalDataGateway(
              stock_fetcher=lambda symbol, begin, finish: rest.fetch_stock_bars(
                  symbol,
                  begin,
                  finish,
                  feed=settings.historical_stock_feed,
              ),
              crypto_fetcher=lambda symbol, begin, finish: rest.fetch_crypto_bars(
                  symbol,
                  begin,
                  finish,
              ),
              cache_root=None,
              stock_feed=settings.historical_stock_feed,
          )

          start = date(2025, 1, 2)
          research_end = date(2026, 8, 28)
          external_day = date(2026, 9, 1)
          begin = datetime.combine(start, time.min, tzinfo=timezone.utc)
          finish = datetime(2026, 9, 1, 16, 0, tzinfo=timezone.utc)
          btc = gateway.fetch_crypto_minutes("BTC/USD", begin, finish)
          coin = gateway.fetch_stock_minutes("COIN", begin, finish)
          sessions = [ts.date() for ts in pd.date_range(start=start, end=external_day, freq="B")]
          frame = build_episode_frame(
              btc,
              coin,
              sessions=sessions,
              beta_lookback=40,
          )

          promotion_frame = frame.loc[frame["session_date"] <= research_end].copy()
          study = evaluate_frozen_horizon_sensitivity(
              promotion_frame,
              bootstrap_samples=20_000,
              bootstrap_seed=20260901,
          )

          external = None
          external_rows = frame.loc[frame["session_date"] == external_day]
          if not external_rows.empty:
              row = external_rows.iloc[-1]
              residual = float(row["residual"])
              direction = float(np.sign(residual))
              raw_returns = {
                  str(minutes): float(row[f"forward_{minutes}m_return"])
                  for minutes in (15, 30, 45, 60, 90, 120)
              }
              continuation = {
                  minutes: direction * value for minutes, value in raw_returns.items()
              }
              external = {
                  "session_date": external_day.isoformat(),
                  "residual": residual,
                  "opening_10m_return": float(row["open_10m_return"]),
                  "underlying_returns": raw_returns,
                  "continuation_signed_returns": continuation,
                  "reversion_signed_returns": {
                      minutes: -value for minutes, value in continuation.items()
                  },
                  "note": "Sep 1 is external-only and is excluded from promotion decisions.",
              }

          payload = {
              "research_sample_end": research_end.isoformat(),
              "historical_stock_feed": settings.historical_stock_feed,
              "study": study,
              "sep1_external": external,
          }
          path = Path("artifacts/horizon-study/exit-horizon-sensitivity.json")
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Upload research result
        uses: actions/upload-artifact@v4
        with:
          name: exit-horizon-sensitivity
          path: artifacts/horizon-study/exit-horizon-sensitivity.json
          if-no-files-found: error
          retention-days: 5
