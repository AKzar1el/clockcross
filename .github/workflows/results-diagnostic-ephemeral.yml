name: Temporary Competition Results Diagnostic

on:
  push:
    branches:
      - main
    paths:
      - "ops/results-diagnostic-trigger"

permissions:
  contents: read

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: competition
      deployment: false
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_COMPETITION_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_COMPETITION_SECRET_KEY }}
    steps:
      - name: Read competition account and orders
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request

          base = "https://paper-api.alpaca.markets"
          headers = {
              "APCA-API-KEY-ID": os.environ["ALPACA_API_KEY"],
              "APCA-API-SECRET-KEY": os.environ["ALPACA_SECRET_KEY"],
          }

          def get(path, params=None):
              url = base + path
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)

          account = get("/v2/account")
          positions = get("/v2/positions")
          orders = get("/v2/orders", {"status": "all", "limit": 50, "nested": "true", "direction": "desc"})

          def slim_leg(leg):
              return {
                  "symbol": leg.get("symbol"),
                  "side": leg.get("side"),
                  "position_intent": leg.get("position_intent"),
                  "qty": leg.get("qty"),
                  "filled_qty": leg.get("filled_qty"),
                  "filled_avg_price": leg.get("filled_avg_price"),
              }

          def slim_order(order):
              return {
                  "client_order_id": order.get("client_order_id"),
                  "status": order.get("status"),
                  "order_class": order.get("order_class"),
                  "qty": order.get("qty"),
                  "filled_qty": order.get("filled_qty"),
                  "filled_avg_price": order.get("filled_avg_price"),
                  "limit_price": order.get("limit_price"),
                  "submitted_at": order.get("submitted_at"),
                  "filled_at": order.get("filled_at"),
                  "legs": [slim_leg(x) for x in (order.get("legs") or [])],
              }

          out = {
              "account": {
                  "status": account.get("status"),
                  "equity": account.get("equity"),
                  "last_equity": account.get("last_equity"),
                  "cash": account.get("cash"),
                  "portfolio_value": account.get("portfolio_value"),
                  "buying_power": account.get("buying_power"),
              },
              "positions": [
                  {
                      "symbol": p.get("symbol"),
                      "qty": p.get("qty"),
                      "market_value": p.get("market_value"),
                      "unrealized_pl": p.get("unrealized_pl"),
                  }
                  for p in positions
              ],
              "orders": [slim_order(o) for o in orders],
          }
          print(json.dumps(out, indent=2, sort_keys=True))
          PY
