name: Secure Bootstrap V2

on:
  push:
    paths:
      - "ops/bootstrap-trigger-v2"

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Generate and publish ephemeral transport key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/bootstrap-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/bootstrap-private.pem -pubout -out /tmp/bootstrap-public.pem >/dev/null 2>&1
          content=$(base64 -w0 /tmp/bootstrap-public.pem)
          current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/ops/bootstrap-public.pem?ref=main" --jq '.sha' 2>/dev/null || true)
          if [ -n "$current_sha" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/ops/bootstrap-public.pem" \
              -f message='ops: rotate ephemeral bootstrap public key' \
              -f content="$content" \
              -f branch=main \
              -f sha="$current_sha" >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/ops/bootstrap-public.pem" \
              -f message='ops: publish ephemeral bootstrap public key' \
              -f content="$content" \
              -f branch=main >/dev/null
          fi
          echo "Ephemeral bootstrap public key published"

      - name: Wait for encrypted payload and configure services
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_PATH: ops/bootstrap-payload.b64
        run: |
          set -euo pipefail
          cleanup() {
            rm -f /tmp/bootstrap-private.pem /tmp/bootstrap-public.pem /tmp/bootstrap-content.json /tmp/bootstrap-payload.b64 /tmp/bootstrap-payload.enc /tmp/bootstrap.json /tmp/cf-response.json /tmp/cf-accounts.json /tmp/cf-probe.json
          }
          trap cleanup EXIT

          found=0
          for _ in $(seq 1 240); do
            if gh api "repos/${GITHUB_REPOSITORY}/contents/${BOOTSTRAP_PATH}?ref=main" > /tmp/bootstrap-content.json 2>/dev/null; then
              found=1
              break
            fi
            sleep 5
          done
          if [ "$found" -ne 1 ]; then
            echo "Encrypted bootstrap payload did not arrive in time" >&2
            exit 2
          fi

          jq -r '.content' /tmp/bootstrap-content.json | tr -d '\n' | base64 -d > /tmp/bootstrap-payload.b64
          base64 -d /tmp/bootstrap-payload.b64 > /tmp/bootstrap-payload.enc
          openssl pkeyutl -decrypt \
            -inkey /tmp/bootstrap-private.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            -in /tmp/bootstrap-payload.enc \
            -out /tmp/bootstrap.json
          chmod 600 /tmp/bootstrap.json

          GH_PAT=$(jq -er '.github_pat' /tmp/bootstrap.json)
          CF_READ_TOKEN=$(jq -er '.cf_read_token' /tmp/bootstrap.json)
          CF_EDIT_TOKEN=$(jq -er '.cf_edit_token' /tmp/bootstrap.json)
          ALPACA_KEY=$(jq -er '.alpaca_key' /tmp/bootstrap.json)
          ALPACA_SECRET=$(jq -er '.alpaca_secret' /tmp/bootstrap.json)
          echo "::add-mask::$GH_PAT"
          echo "::add-mask::$CF_READ_TOKEN"
          echo "::add-mask::$CF_EDIT_TOKEN"
          echo "::add-mask::$ALPACA_KEY"
          echo "::add-mask::$ALPACA_SECRET"

          export GH_TOKEN="$GH_PAT"
          gh api "repos/${GITHUB_REPOSITORY}" >/dev/null

          account=$(curl -fsS -H "APCA-API-KEY-ID: $ALPACA_KEY" -H "APCA-API-SECRET-KEY: $ALPACA_SECRET" https://paper-api.alpaca.markets/v2/account)
          positions=$(curl -fsS -H "APCA-API-KEY-ID: $ALPACA_KEY" -H "APCA-API-SECRET-KEY: $ALPACA_SECRET" https://paper-api.alpaca.markets/v2/positions)
          orders=$(curl -fsS -H "APCA-API-KEY-ID: $ALPACA_KEY" -H "APCA-API-SECRET-KEY: $ALPACA_SECRET" "https://paper-api.alpaca.markets/v2/orders?status=all&limit=500&direction=desc")

          created_at=$(jq -r '.created_at // ""' <<<"$account")
          status=$(jq -r '.status // ""' <<<"$account")
          equity=$(jq -r '.equity // "0"' <<<"$account")
          cash=$(jq -r '.cash // "0"' <<<"$account")
          portfolio=$(jq -r '.portfolio_value // "0"' <<<"$account")
          options_level=$(jq -r '.options_trading_level // 0' <<<"$account")
          approved_level=$(jq -r '.options_approved_level // 0' <<<"$account")
          trading_blocked=$(jq -r '.trading_blocked // true' <<<"$account")
          account_blocked=$(jq -r '.account_blocked // true' <<<"$account")
          positions_count=$(jq 'length' <<<"$positions")
          orders_count=$(jq 'length' <<<"$orders")

          eligible=$(python3 - "$created_at" "$status" "$equity" "$cash" "$portfolio" "$options_level" "$approved_level" "$trading_blocked" "$account_blocked" "$positions_count" "$orders_count" <<'PY'
          import sys
          from datetime import datetime, timezone
          from decimal import Decimal
          created_at, status, equity, cash, portfolio, options_level, approved_level, trading_blocked, account_blocked, positions_count, orders_count = sys.argv[1:]
          try:
              created = datetime.fromisoformat(created_at.replace('Z', '+00:00'))
          except ValueError:
              print('false'); raise SystemExit
          kickoff = datetime(2026, 8, 28, 15, 0, tzinfo=timezone.utc)
          ok = (created >= kickoff and status == 'ACTIVE' and Decimal(equity) == Decimal('100000') and Decimal(cash) == Decimal('100000') and Decimal(portfolio) == Decimal('100000') and int(options_level) >= 3 and int(approved_level) >= 3 and trading_blocked == 'false' and account_blocked == 'false' and int(positions_count) == 0 and int(orders_count) == 0)
          print('true' if ok else 'false')
          PY
          )
          echo "Alpaca safe summary: created_at=${created_at}; status=${status}; equity=${equity}; options=${options_level}/${approved_level}; positions=${positions_count}; prior_orders=${orders_count}"

          curl -fsS -H "Authorization: Bearer $CF_READ_TOKEN" https://api.cloudflare.com/client/v4/accounts > /tmp/cf-accounts.json
          jq -e '.success == true and (.result | length) > 0' /tmp/cf-accounts.json >/dev/null
          CF_ACCOUNT_ID=""
          while IFS= read -r candidate; do
            code=$(curl -sS -o /tmp/cf-probe.json -w '%{http_code}' -H "Authorization: Bearer $CF_EDIT_TOKEN" "https://api.cloudflare.com/client/v4/accounts/${candidate}/workers/scripts/clockcross-ai-gateway/settings")
            if [ "$code" = "200" ]; then CF_ACCOUNT_ID="$candidate"; break; fi
          done < <(jq -r '.result[].id' /tmp/cf-accounts.json)
          if [ -z "$CF_ACCOUNT_ID" ]; then echo "Could not resolve Cloudflare account containing clockcross-ai-gateway" >&2; exit 3; fi
          echo "::add-mask::$CF_ACCOUNT_ID"

          GATEWAY_BEARER=$(openssl rand -hex 32)
          echo "::add-mask::$GATEWAY_BEARER"
          cf_body=$(jq -nc --arg value "$GATEWAY_BEARER" '{name:"CLOCKCROSS_AI_AUTH",type:"secret_text",text:$value}')
          curl -fsS -X PUT -H "Authorization: Bearer $CF_EDIT_TOKEN" -H "Content-Type: application/json" --data "$cf_body" "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/clockcross-ai-gateway/secrets" > /tmp/cf-response.json
          jq -e '.success == true' /tmp/cf-response.json >/dev/null
          echo "Cloudflare gateway secret updated"

          gh api --method PUT "repos/${GITHUB_REPOSITORY}/environments/competition" --input - <<< '{}' >/dev/null
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/environments/development" --input - <<< '{}' >/dev/null
          printf '%s' "$GATEWAY_BEARER" | gh secret set CLOCKCROSS_AI_GATEWAY_BEARER --env competition --repo "$GITHUB_REPOSITORY"
          printf '%s' "$GATEWAY_BEARER" | gh secret set CLOCKCROSS_AI_GATEWAY_BEARER --env development --repo "$GITHUB_REPOSITORY"

          account_id=$(jq -r '.id' <<<"$account")
          echo "::add-mask::$account_id"
          if [ "$eligible" = "true" ]; then
            printf '%s' "$ALPACA_KEY" | gh secret set ALPACA_COMPETITION_API_KEY --env competition --repo "$GITHUB_REPOSITORY"
            printf '%s' "$ALPACA_SECRET" | gh secret set ALPACA_COMPETITION_SECRET_KEY --env competition --repo "$GITHUB_REPOSITORY"
            printf '%s' "$account_id" | gh secret set ALPACA_COMPETITION_ACCOUNT_ID --env competition --repo "$GITHUB_REPOSITORY"
            echo "ALPACA_CLASSIFICATION=competition_candidate"
            echo "COMPETITION_SECRETS_READY=true"
          else
            printf '%s' "$ALPACA_KEY" | gh secret set ALPACA_DEVELOPMENT_API_KEY --env development --repo "$GITHUB_REPOSITORY"
            printf '%s' "$ALPACA_SECRET" | gh secret set ALPACA_DEVELOPMENT_SECRET_KEY --env development --repo "$GITHUB_REPOSITORY"
            echo "ALPACA_CLASSIFICATION=development"
            echo "COMPETITION_SECRETS_READY=false"
          fi

          echo "competition environment secret names:"
          gh secret list --env competition --repo "$GITHUB_REPOSITORY" | cut -f1 | sort
          echo "development environment secret names:"
          gh secret list --env development --repo "$GITHUB_REPOSITORY" | cut -f1 | sort
