name: Rolling Regime Gate Diagnostic Ephemeral

on:
  push:
    branches:
      - research/monthly-end-to-end-backtest
    paths:
      - ".github/workflows/rolling-regime-gate-diagnostic-ephemeral.yml"

permissions:
  contents: read

env:
  ALPACA_API_KEY: ${{ secrets.ALPACA_COMPETITION_API_KEY }}
  ALPACA_SECRET_KEY: ${{ secrets.ALPACA_COMPETITION_SECRET_KEY }}
  LLM_API_KEY: ${{ secrets.CLOCKCROSS_AI_GATEWAY_BEARER }}
  LLM_BASE_URL: https://clockcross-ai-gateway.tomi-seregi99.workers.dev/v1
  LLM_MODEL: clockcross-cloudflare-llama-3.3-70b
  CLOCKCROSS_ACCOUNT_ROLE: competition
  CLOCKCROSS_ALLOW_DEV_ORDER: "false"

jobs:
  regime-study:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: competition
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Test rolling five-signal regime gate
        shell: bash
        run: |
          mkdir -p artifacts/monthly-backtest
          uv run python - <<'PY'
          import json
          from collections import deque
          from datetime import date, datetime, time
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import httpx
          import numpy as np
          import pandas as pd
          from clockcross.agent.adjudicator import Adjudicator, AgentContext
          from clockcross.alpaca.historical import AlpacaRestHistoryClient, HistoricalDataGateway
          from clockcross.config import Settings
          from clockcross.domain import AgentAction
          from clockcross.live_signal import LiveCoinSignalGateway, LiveSignalPolicy
          from clockcross.trading.constructor import direction_from_agent

          ET=ZoneInfo("America/New_York"); UTC=ZoneInfo("UTC")
          EVAL_START=date(2026,6,1); END=date(2026,9,1); SEED_START=date(2026,3,2); HISTORY_START=date(2025,11,1)
          WINDOW=5; FROZEN_MEAN=0.002745696957097104
          settings=Settings(); headers={"APCA-API-KEY-ID":settings.alpaca_api_key,"APCA-API-SECRET-KEY":settings.alpaca_secret_key}; http=httpx.Client(timeout=30.0)
          cal=http.get("https://paper-api.alpaca.markets/v2/calendar",params={"start":SEED_START.isoformat(),"end":END.isoformat()},headers=headers);cal.raise_for_status();sessions=[date.fromisoformat(x["date"]) for x in cal.json()]
          rest=AlpacaRestHistoryClient(settings.alpaca_api_key,settings.alpaca_secret_key,base_url=str(settings.alpaca_data_base_url))
          hg=HistoricalDataGateway(stock_fetcher=lambda s,b,e:rest.fetch_stock_bars(s,b,e,feed=settings.historical_stock_feed),crypto_fetcher=lambda s,b,e:rest.fetch_crypto_bars(s,b,e),cache_root=None,stock_feed=settings.historical_stock_feed)
          begin=datetime.combine(HISTORY_START,time.min,tzinfo=ET).astimezone(UTC);finish=datetime.combine(END,time(12),tzinfo=ET).astimezone(UTC)
          btc=hg.fetch_crypto_minutes("BTC/USD",begin,finish);coin=hg.fetch_stock_minutes("COIN",begin,finish)
          class MH:
              @staticmethod
              def sl(f,b,e):return f.loc[(f.index>=pd.Timestamp(b))&(f.index<=pd.Timestamp(e))].copy()
              def fetch_crypto_minutes(self,s,b,e):return self.sl(btc,b,e)
              def fetch_stock_minutes(self,s,b,e):return self.sl(coin,b,e)
          policy=LiveSignalPolicy.model_validate(json.loads(Path("docs/research/2026-08-29-live-signal-policy.json").read_text()))
          sg=LiveCoinSignalGateway(history=MH(),policy=policy,history_days=120,historical_mean_signed_return=FROZEN_MEAN)
          ai=Adjudicator(base_url=str(settings.llm_base_url),api_key=settings.llm_api_key or "",model=settings.llm_model or "clockcross-cloudflare-llama-3.3-70b",timeout_seconds=30.0)
          def st(d,h,m):return pd.Timestamp(datetime.combine(d,time(h,m),tzinfo=ET).astimezone(UTC))
          def px(f,s):
              if s not in f.index:return None
              v=f.loc[s,"open"];return None if isinstance(v,pd.Series) else float(v)
          def news(d):
              b=datetime.combine(d,time(0),tzinfo=ET).astimezone(UTC);e=datetime.combine(d,time(9,55),tzinfo=ET).astimezone(UTC)
              r=http.get("https://data.alpaca.markets/v1beta1/news",params={"symbols":"COIN","start":b.isoformat().replace("+00:00","Z"),"end":e.isoformat().replace("+00:00","Z"),"sort":"desc","limit":10,"include_content":"false"},headers=headers);r.raise_for_status()
              return [{"headline":x.get("headline"),"summary":x.get("summary"),"source":x.get("source"),"created_at":x.get("created_at")} for x in r.json().get("news",[])[:10]]
          def signed(direction,forward):
              if direction is None:return 0.0
              return forward if direction=="bullish" else -forward
          trailing=deque(maxlen=WINDOW);rows=[];seed_signals=0
          for d in sessions:
              f=sg.collect_premarket(d)
              if f is None:continue
              f=sg.opening_confirmation(f)
              if f is None:continue
              ev=sg.evaluate(f)
              if not ev.approved:continue
              en=px(coin,st(d,9,55));ex=px(coin,st(d,10,55))
              if en is None or ex is None or en<=0:continue
              forward=ex/en-1;rs=1 if f.residual>0 else -1
              continuation="bullish" if rs>0 else "bearish"; cont_return=signed(continuation,forward)
              prior=list(trailing); prior_mean=float(np.mean(prior)) if prior else None; regime_ready=len(prior)==WINDOW; recent_continuation_negative=regime_ready and prior_mean<0
              if d < EVAL_START:
                  trailing.append(cont_return);seed_signals+=1;continue
              n=news(d)
              dec=ai.decide(AgentContext(underlying="COIN",residual=f.residual,residual_z=ev.residual_z,residual_sign=rs,btc_return=f.btc_return,opening_10m_return=f.opening_10m_return,historical_mean_signed_return=ev.historical_mean_signed_return,option_feed="indicative",available_structures=("call_debit_spread","put_debit_spread"),news_summary=json.dumps(n,sort_keys=True,default=str,separators=(",",":"))[:1600]))
              current=direction_from_agent(dec.action,rs); gated=current
              gate_applied=False
              if dec.action==AgentAction.REVERSION and not recent_continuation_negative:
                  gated=continuation;gate_applied=True
              rows.append({"date":d.isoformat(),"month":d.strftime("%Y-%m"),"action":dec.action.value,"residual":f.residual,"residual_z":ev.residual_z,"prior_signal_count":len(prior),"prior_five_continuation_returns":prior,"prior_five_mean":prior_mean,"recent_continuation_negative":recent_continuation_negative,"gate_applied":gate_applied,"current_direction":current,"gated_direction":gated,"coin_60m_return":forward,"continuation_return":cont_return,"current_ai_return":signed(current,forward),"gated_return":signed(gated,forward)})
              # Outcome becomes available only after the 10:55 exit, so add it after today's decision.
              trailing.append(cont_return)
          def stats(vals):
              if not vals:return {"count":0,"wins":0,"losses":0,"mean":None,"median":None,"hit_rate":None,"sum":0.0}
              a=np.asarray(vals,float);return {"count":int(a.size),"wins":int((a>0).sum()),"losses":int((a<0).sum()),"mean":float(a.mean()),"median":float(np.median(a)),"hit_rate":float((a>0).mean()),"sum":float(a.sum())}
          overall={"continuation":stats([r["continuation_return"] for r in rows]),"current_ai":stats([r["current_ai_return"] for r in rows if r["current_direction"] is not None]),"rolling_gate":stats([r["gated_return"] for r in rows if r["gated_direction"] is not None])}
          monthly={}
          for m in sorted({r["month"] for r in rows}):
              q=[r for r in rows if r["month"]==m];monthly[m]={"continuation":stats([r["continuation_return"] for r in q]),"current_ai":stats([r["current_ai_return"] for r in q if r["current_direction"] is not None]),"rolling_gate":stats([r["gated_return"] for r in q if r["gated_direction"] is not None])}
          payload={"study":"rolling_five_completed_signal_regime_gate","window":WINDOW,"seed_start":SEED_START.isoformat(),"evaluation_start":EVAL_START.isoformat(),"evaluation_end":END.isoformat(),"seed_signal_count":seed_signals,"rule":"AI reversion is permitted only when the mean continuation return of the five most recent completed signal episodes is negative. Otherwise a reversion decision falls back to frozen continuation. AI continuation/abstain are unchanged.","lookahead_control":"Today's continuation outcome is appended to the rolling deque only after today's decision and is therefore unavailable to today's gate.","promotion_gate":"Primary predeclared window=5. Promote only if overall mean improves on both current AI and raw continuation while preserving a positive August regime; do not search the window length for a winner.","overall":overall,"monthly":monthly,"gate_application_count":sum(r["gate_applied"] for r in rows),"rows":rows,"limitations":["Current deployed AI is replayed on timestamp-capped historical context, not historical provider state.","The five-signal window is a one-month-ish signal-frequency regime proxy, not an optimized window length."]}
          Path("artifacts/monthly-backtest/rolling-regime-gate.json").write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n");print(json.dumps(payload,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rolling-regime-gate
          path: artifacts/monthly-backtest/rolling-regime-gate.json
          if-no-files-found: error
          retention-days: 5
