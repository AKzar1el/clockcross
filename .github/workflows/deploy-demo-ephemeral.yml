name: ClockCross judge demo deploy ephemeral

on:
  push:
    branches:
      - feat/clockcross-core

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy zero-secret judge demo
        shell: bash
        run: |
          set -euo pipefail
          cd deploy/cloudflare-demo
          npx --yes wrangler@latest deploy --config wrangler.jsonc 2>&1 | tee /tmp/clockcross-demo-deploy.log

          url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/clockcross-demo-deploy.log | tail -1 || true)"
          if [ -z "$url" ]; then
            echo "Judge demo URL was not discovered from Wrangler output" >&2
            exit 1
          fi
          echo "CLOCKCROSS_DEMO_URL=$url"

          ready=false
          for attempt in $(seq 1 30); do
            http="$(curl -sS -o /tmp/clockcross-demo.html -w '%{http_code}' "$url/" || true)"
            if [ "$http" = "200" ] && grep -Fq "Evidence, not promises." /tmp/clockcross-demo.html && grep -Fq "MUTATE" /tmp/clockcross-demo.html; then
              ready=true
              break
            fi
            sleep 2
          done
          echo "CLOCKCROSS_DEMO_PUBLIC=$ready"
          if [ "$ready" != "true" ]; then
            exit 1
          fi
