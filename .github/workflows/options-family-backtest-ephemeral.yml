name: Options Family Backtest Ephemeral

on:
  push:
    branches:
      - research/monthly-end-to-end-backtest
    paths:
      - ".github/workflows/options-family-backtest-ephemeral.yml"

permissions:
  contents: read

env:
  ALPACA_API_KEY: ${{ secrets.ALPACA_COMPETITION_API_KEY }}
  ALPACA_SECRET_KEY: ${{ secrets.ALPACA_COMPETITION_SECRET_KEY }}
  CLOCKCROSS_ACCOUNT_ROLE: competition
  CLOCKCROSS_ALLOW_DEV_ORDER: "false"

jobs:
  replay-options:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: competition
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Replay historical option-price families
        shell: bash
        run: |
          mkdir -p artifacts/monthly-backtest
          uv run python - <<'PY'
          import json
          from datetime import date, datetime, time, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import httpx
          import numpy as np

          from clockcross.alpaca.historical import AlpacaRestHistoryClient
          from clockcross.config import Settings

          ET = ZoneInfo("America/New_York")
          UTC = ZoneInfo("UTC")
          DAYS = [
              date(2026, 8, 7),
              date(2026, 8, 18),
              date(2026, 8, 21),
              date(2026, 8, 24),
              date(2026, 9, 1),
          ]
          # Current AI replay chose bullish on all five signal days.
          WIDTH_TARGETS = (5.0, 10.0, 15.0, 20.0)
          FRICTION_DOLLARS = (0.0, 0.10, 0.20, 0.30)  # per spread round-trip, per share

          settings = Settings()
          headers = {
              "APCA-API-KEY-ID": settings.alpaca_api_key,
              "APCA-API-SECRET-KEY": settings.alpaca_secret_key,
          }
          http = httpx.Client(timeout=30.0)
          stock = AlpacaRestHistoryClient(settings.alpaca_api_key, settings.alpaca_secret_key)

          def utc_dt(day, hh, mm):
              return datetime.combine(day, time(hh, mm), tzinfo=ET).astimezone(UTC)

          def spot_0955(day):
              rows = stock.fetch_stock_bars(
                  "COIN", utc_dt(day, 9, 54), utc_dt(day, 9, 57), feed="sip"
              )
              for row in rows:
                  if str(row["timestamp"]).startswith(utc_dt(day, 9, 55).strftime("%Y-%m-%dT%H:%M")):
                      return float(row["open"])
              raise RuntimeError(f"missing COIN 09:55 bar for {day}")

          def fetch_contracts(day, spot):
              expiry_min = day + timedelta(days=7)
              expiry_max = day + timedelta(days=21)
              combined = {}
              for status in ("active", "inactive"):
                  token = None
                  while True:
                      params = {
                          "underlying_symbols": "COIN",
                          "status": status,
                          "expiration_date_gte": expiry_min.isoformat(),
                          "expiration_date_lte": expiry_max.isoformat(),
                          "strike_price_gte": f"{spot * 0.75:.2f}",
                          "strike_price_lte": f"{spot * 1.35:.2f}",
                          "type": "call",
                          "limit": 10000,
                      }
                      if token:
                          params["page_token"] = token
                      r = http.get("https://paper-api.alpaca.markets/v2/options/contracts", params=params, headers=headers)
                      r.raise_for_status()
                      data = r.json()
                      for item in data.get("option_contracts", []):
                          combined[item["symbol"]] = item
                      token = data.get("next_page_token")
                      if not token:
                          break
              return list(combined.values())

          def fetch_option_bars(symbols, day):
              merged = {}
              for offset in range(0, len(symbols), 100):
                  chunk = symbols[offset:offset+100]
                  token = None
                  while True:
                      params = {
                          "symbols": ",".join(chunk),
                          "timeframe": "1Min",
                          "start": utc_dt(day, 9, 50).isoformat().replace("+00:00", "Z"),
                          "end": utc_dt(day, 11, 0).isoformat().replace("+00:00", "Z"),
                          "limit": 10000,
                          "sort": "asc",
                      }
                      if token:
                          params["page_token"] = token
                      r = http.get("https://data.alpaca.markets/v1beta1/options/bars", params=params, headers=headers)
                      r.raise_for_status()
                      data = r.json()
                      raw = data.get("bars", {})
                      if isinstance(raw, dict):
                          for symbol, bars in raw.items():
                              merged.setdefault(symbol, []).extend(bars)
                      token = data.get("next_page_token")
                      if not token:
                          break
              return merged

          def minute_of(raw):
              return datetime.fromisoformat(raw["t"].replace("Z", "+00:00")).astimezone(ET)

          def trade_proxy(bars, day, *, entry):
              if not bars:
                  return None
              if entry:
                  candidates = [b for b in bars if time(9,55) <= minute_of(b).time().replace(tzinfo=None) <= time(10,0)]
                  if not candidates:
                      return None
                  chosen = min(candidates, key=lambda b: minute_of(b))
                  return {"price": float(chosen["c"]), "time": minute_of(chosen).isoformat()}
              candidates = [b for b in bars if time(10,50) <= minute_of(b).time().replace(tzinfo=None) <= time(10,55)]
              if not candidates:
                  return None
              chosen = max(candidates, key=lambda b: minute_of(b))
              return {"price": float(chosen["c"]), "time": minute_of(chosen).isoformat()}

          all_days = []
          family_returns = {str(width): [] for width in WIDTH_TARGETS}
          family_pnl = {str(width): [] for width in WIDTH_TARGETS}

          for day in DAYS:
              spot = spot_0955(day)
              contracts = fetch_contracts(day, spot)
              if not contracts:
                  all_days.append({"date": day.isoformat(), "spot": spot, "status": "no_contracts"})
                  continue
              calls = []
              for item in contracts:
                  try:
                      strike = float(item["strike_price"])
                      expiry = date.fromisoformat(item["expiration_date"])
                  except Exception:
                      continue
                  calls.append({"symbol": item["symbol"], "strike": strike, "expiry": expiry, "status": item.get("status")})
              # Long-leg proxy for the live 0.45-0.65 delta rule: nearest strike to spot.
              # Prefer expiry closest to 14 DTE, then ATM proximity.
              expiries = sorted({c["expiry"] for c in calls}, key=lambda e: (abs((e-day).days-14), e))
              selected_expiry = expiries[0]
              same = sorted([c for c in calls if c["expiry"] == selected_expiry], key=lambda c: c["strike"])
              long_leg = min(same, key=lambda c: (abs(c["strike"]-spot), c["strike"]))
              symbols = [c["symbol"] for c in same]
              bars = fetch_option_bars(symbols, day)
              long_entry = trade_proxy(bars.get(long_leg["symbol"], []), day, entry=True)
              long_exit = trade_proxy(bars.get(long_leg["symbol"], []), day, entry=False)

              variants = []
              for width_target in WIDTH_TARGETS:
                  shorts = [c for c in same if c["strike"] > long_leg["strike"]]
                  if not shorts:
                      continue
                  short_leg = min(shorts, key=lambda c: (abs((c["strike"]-long_leg["strike"])-width_target), c["strike"]))
                  short_entry = trade_proxy(bars.get(short_leg["symbol"], []), day, entry=True)
                  short_exit = trade_proxy(bars.get(short_leg["symbol"], []), day, entry=False)
                  if not all((long_entry, long_exit, short_entry, short_exit)):
                      variants.append({
                          "width_target": width_target,
                          "long_symbol": long_leg["symbol"],
                          "short_symbol": short_leg["symbol"],
                          "status": "insufficient_trade_bars",
                      })
                      continue
                  width = short_leg["strike"] - long_leg["strike"]
                  entry_value = long_entry["price"] - short_entry["price"]
                  exit_value = long_exit["price"] - short_exit["price"]
                  if entry_value <= 0 or entry_value >= width:
                      variants.append({
                          "width_target": width_target,
                          "long_symbol": long_leg["symbol"],
                          "short_symbol": short_leg["symbol"],
                          "status": "invalid_trade_proxy_debit",
                          "entry_value": entry_value,
                          "exit_value": exit_value,
                      })
                      continue
                  pnl_share = exit_value - entry_value
                  ret = pnl_share / entry_value
                  friction = {
                      f"{f:.2f}": {
                          "pnl_dollars_one_contract": (pnl_share - f) * 100.0,
                          "return_on_debit": (pnl_share - f) / entry_value,
                      }
                      for f in FRICTION_DOLLARS
                  }
                  variant = {
                      "width_target": width_target,
                      "actual_width": width,
                      "long_symbol": long_leg["symbol"],
                      "long_strike": long_leg["strike"],
                      "short_symbol": short_leg["symbol"],
                      "short_strike": short_leg["strike"],
                      "entry_long": long_entry,
                      "entry_short": short_entry,
                      "exit_long": long_exit,
                      "exit_short": short_exit,
                      "entry_spread_value": entry_value,
                      "exit_spread_value": exit_value,
                      "raw_pnl_dollars_one_contract": pnl_share * 100.0,
                      "raw_return_on_debit": ret,
                      "friction": friction,
                      "status": "priced",
                  }
                  variants.append(variant)
                  family_returns[str(width_target)].append(ret)
                  family_pnl[str(width_target)].append(pnl_share * 100.0)

              all_days.append({
                  "date": day.isoformat(),
                  "spot_0955": spot,
                  "contract_count": len(calls),
                  "selected_expiry": selected_expiry.isoformat(),
                  "dte": (selected_expiry-day).days,
                  "long_proxy_symbol": long_leg["symbol"],
                  "long_proxy_strike": long_leg["strike"],
                  "long_moneyness": long_leg["strike"] / spot - 1.0,
                  "variants": variants,
                  "status": "replayed",
              })

          def stats(values):
              if not values:
                  return {"count": 0, "mean": None, "median": None, "hit_rate": None, "sum": 0.0}
              arr = np.asarray(values, dtype=float)
              return {
                  "count": int(arr.size),
                  "mean": float(arr.mean()),
                  "median": float(np.median(arr)),
                  "hit_rate": float((arr > 0).mean()),
                  "sum": float(arr.sum()),
                  "wins": int((arr > 0).sum()),
                  "losses": int((arr < 0).sum()),
              }

          payload = {
              "study": "historical_option_price_family_replay",
              "signal_days": [d.isoformat() for d in DAYS],
              "direction": "bullish on all five days per current chronological AI replay",
              "method": {
                  "expiry": "available expiry nearest 14 DTE within frozen 7-21 DTE band",
                  "long_leg": "strike nearest 09:55 underlying spot as transparent proxy for frozen 0.45-0.65 long-delta requirement",
                  "short_legs": "nearest available strike to +5/+10/+15/+20 width targets",
                  "entry": "first observed 1-minute option trade bar from 09:55 through 10:00 ET",
                  "exit": "last observed 1-minute option trade bar from 10:50 through 10:55 ET",
              },
              "limitations": [
                  "This is not an exact replay of the live constructor because Alpaca historical option snapshots do not expose the old 09:55 Greek/bid-ask surface used by live selection.",
                  "OHLC option bars reflect trades, not executable historical bid/ask quotes. Spread values can therefore be affected by asynchronous leg prints.",
                  "The near-ATM long strike is a transparent moneyness proxy for the live 0.45-0.65 delta band, not a reconstructed historical Greek.",
              ],
              "friction_dollars_per_share_round_trip": list(FRICTION_DOLLARS),
              "width_stats_raw_return_on_debit": {k: stats(v) for k,v in family_returns.items()},
              "width_stats_raw_pnl_dollars_one_contract": {k: stats(v) for k,v in family_pnl.items()},
              "days": all_days,
          }
          Path("artifacts/monthly-backtest/options-family-replay.json").write_text(json.dumps(payload, indent=2, sort_keys=True)+"\n")
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: options-family-replay
          path: artifacts/monthly-backtest/options-family-replay.json
          if-no-files-found: error
          retention-days: 5
