name: Constructor Constraint Diagnostic Ephemeral

on:
  push:
    branches:
      - research/monthly-end-to-end-backtest
    paths:
      - ".github/workflows/constructor-constraint-diagnostic-ephemeral.yml"

permissions:
  contents: read

env:
  ALPACA_API_KEY: ${{ secrets.ALPACA_COMPETITION_API_KEY }}
  ALPACA_SECRET_KEY: ${{ secrets.ALPACA_COMPETITION_SECRET_KEY }}
  CLOCKCROSS_ACCOUNT_ROLE: competition
  CLOCKCROSS_ALLOW_DEV_ORDER: "false"

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: competition
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Compare predeclared structural constraints
        shell: bash
        run: |
          mkdir -p artifacts/monthly-backtest
          uv run python - <<'PY'
          import json, math
          from datetime import date, datetime, time, timedelta
          from decimal import Decimal
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import httpx, numpy as np
          from clockcross.alpaca.historical import AlpacaRestHistoryClient
          from clockcross.config import Settings

          ET=ZoneInfo("America/New_York"); UTC=ZoneInfo("UTC")
          DAYS=[date(2026,8,7),date(2026,8,18),date(2026,8,21),date(2026,8,24),date(2026,9,1)]
          VARIANTS={
              "current":{"min_short_delta":0.0,"max_width_fraction":None},
              "meaningful_short":{"min_short_delta":0.10,"max_width_fraction":None},
              "spot_scaled_width":{"min_short_delta":0.0,"max_width_fraction":0.10},
              "combined":{"min_short_delta":0.10,"max_width_fraction":0.10},
          }
          LONG_MIN=0.45; LONG_MAX=0.65; MIN_NET=0.30; MAX_DEBIT=10.0; R=0.04
          settings=Settings(); headers={"APCA-API-KEY-ID":settings.alpaca_api_key,"APCA-API-SECRET-KEY":settings.alpaca_secret_key}; http=httpx.Client(timeout=30.0); stock=AlpacaRestHistoryClient(settings.alpaca_api_key,settings.alpaca_secret_key)
          def ud(d,h,m): return datetime.combine(d,time(h,m),tzinfo=ET).astimezone(UTC)
          def ncdf(x): return .5*(1+math.erf(x/math.sqrt(2)))
          def call(s,k,t,v):
              if t<=0 or v<=0:return max(0,s-k)
              d1=(math.log(s/k)+(R+.5*v*v)*t)/(v*math.sqrt(t));d2=d1-v*math.sqrt(t);return s*ncdf(d1)-k*math.exp(-R*t)*ncdf(d2)
          def ivd(p,s,k,t):
              intr=max(0,s-k*math.exp(-R*t))
              if not (p>intr and p<s):return None
              lo,hi=.01,5
              if call(s,k,t,hi)<p:return None
              for _ in range(70):
                  md=(lo+hi)/2
                  if call(s,k,t,md)<p:lo=md
                  else:hi=md
              v=(lo+hi)/2;d1=(math.log(s/k)+(R+.5*v*v)*t)/(v*math.sqrt(t));return v,ncdf(d1)
          def spot(d):
              rr=stock.fetch_stock_bars("COIN",ud(d,9,54),ud(d,9,57),feed="sip"); key=ud(d,9,55).strftime("%Y-%m-%dT%H:%M"); return next(float(x["open"]) for x in rr if str(x["timestamp"]).startswith(key))
          def contracts(d,s):
              out={}
              for status in ("active","inactive"):
                  token=None
                  while True:
                      p={"underlying_symbols":"COIN","status":status,"expiration_date_gte":(d+timedelta(days=7)).isoformat(),"expiration_date_lte":(d+timedelta(days=21)).isoformat(),"strike_price_gte":f"{s*.65:.2f}","strike_price_lte":f"{s*1.45:.2f}","type":"call","limit":10000}
                      if token:p["page_token"]=token
                      r=http.get("https://paper-api.alpaca.markets/v2/options/contracts",params=p,headers=headers);r.raise_for_status();z=r.json()
                      for x in z.get("option_contracts",[]):out[x["symbol"]]=x
                      token=z.get("next_page_token")
                      if not token:break
              return list(out.values())
          def bars(syms,d):
              out={}
              for off in range(0,len(syms),100):
                  chunk=syms[off:off+100];token=None
                  while True:
                      p={"symbols":",".join(chunk),"timeframe":"1Min","start":ud(d,9,40).isoformat().replace("+00:00","Z"),"end":ud(d,11,0).isoformat().replace("+00:00","Z"),"limit":10000,"sort":"asc"}
                      if token:p["page_token"]=token
                      r=http.get("https://data.alpaca.markets/v1beta1/options/bars",params=p,headers=headers);r.raise_for_status();z=r.json();raw=z.get("bars",{})
                      if isinstance(raw,dict):
                          for sym,items in raw.items():out.setdefault(sym,[]).extend(items)
                      token=z.get("next_page_token")
                      if not token:break
              return out
          def et(x):return datetime.fromisoformat(x["t"].replace("Z","+00:00")).astimezone(ET)
          def lp(items):
              c=[x for x in items if time(9,40)<=et(x).time().replace(tzinfo=None)<=time(9,55)];return max(c,key=et) if c else None
          def en(items):
              c=[x for x in items if time(9,55)<=et(x).time().replace(tzinfo=None)<=time(10,5)];return min(c,key=et) if c else None
          def ex(items):
              c=[x for x in items if time(10,50)<=et(x).time().replace(tzinfo=None)<=time(10,55)];return max(c,key=et) if c else None
          def choose(options,spotv,cfg):
              best=None
              for l in options:
                  if not LONG_MIN<=l["delta"]<=LONG_MAX:continue
                  for sh in options:
                      if sh["expiry"]!=l["expiry"] or sh["strike"]<=l["strike"]:continue
                      if sh["delta"]<cfg["min_short_delta"]:continue
                      width=sh["strike"]-l["strike"]
                      if cfg["max_width_fraction"] is not None and width>spotv*cfg["max_width_fraction"]:continue
                      debit=l["pre"]-sh["pre"]
                      if not (0<debit<width and debit<=MAX_DEBIT):continue
                      net=l["delta"]-sh["delta"]
                      if net<MIN_NET:continue
                      score=net/debit;key=(-score,-net,debit,l["expiry"],l["symbol"],sh["symbol"])
                      if best is None or key<best[0]:best=(key,l,sh,debit,net,score)
              return best

          days=[]; summary={k:{"selected":0,"priced":0,"entry_coverage":0,"exit_coverage":0,"net_deltas":[],"widths":[],"pnls":[]} for k in VARIANTS}
          for d in DAYS:
              s=spot(d);cs=contracts(d,s);bb=bars([x["symbol"] for x in cs],d);opts=[]
              for x in cs:
                  pre=lp(bb.get(x["symbol"],[]))
                  if pre is None:continue
                  k=float(x["strike_price"]);ep=date.fromisoformat(x["expiration_date"]);T=max((datetime.combine(ep,time(16),tzinfo=ET).astimezone(UTC)-ud(d,9,55)).total_seconds(),1)/(365*24*3600);q=ivd(float(pre["c"]),s,k,T)
                  if q is None:continue
                  iv,delta=q;opts.append({"symbol":x["symbol"],"strike":k,"expiry":ep,"pre":float(pre["c"]),"pre_time":et(pre),"delta":delta,"iv":iv})
              out={}
              for name,cfg in VARIANTS.items():
                  c=choose(opts,s,cfg)
                  if c is None:out[name]={"status":"no_candidate"};continue
                  _,l,sh,debit,net,score=c;summary[name]["selected"]+=1;summary[name]["net_deltas"].append(net);summary[name]["widths"].append(sh["strike"]-l["strike"])
                  le,se,lx,sx=en(bb.get(l["symbol"],[])),en(bb.get(sh["symbol"],[])),ex(bb.get(l["symbol"],[])),ex(bb.get(sh["symbol"],[]))
                  entry_ok=le is not None and se is not None;exit_ok=lx is not None and sx is not None
                  if entry_ok:summary[name]["entry_coverage"]+=1
                  if exit_ok:summary[name]["exit_coverage"]+=1
                  row={"status":"selected","long":l["symbol"],"short":sh["symbol"],"expiry":l["expiry"].isoformat(),"long_strike":l["strike"],"short_strike":sh["strike"],"width":sh["strike"]-l["strike"],"long_delta":l["delta"],"short_delta":sh["delta"],"net_delta":net,"proxy_debit":debit,"delta_per_debit":score,"long_pre_time":l["pre_time"].isoformat(),"short_pre_time":sh["pre_time"].isoformat(),"entry_trade_coverage":entry_ok,"exit_trade_coverage":exit_ok}
                  if entry_ok and exit_ok:
                      entry=float(le["c"])-float(se["c"]);exitv=float(lx["c"])-float(sx["c"])
                      if 0<entry<(sh["strike"]-l["strike"]):
                          pnl=(exitv-entry)*100;row.update({"status":"priced","entry_value":entry,"exit_value":exitv,"raw_pnl":pnl,"friction_0.20_pnl":pnl-20});summary[name]["priced"]+=1;summary[name]["pnls"].append(pnl)
                  out[name]=row
              days.append({"date":d.isoformat(),"spot":s,"variants":out})
          for name,z in summary.items():
              nd=np.asarray(z.pop("net_deltas"),float);wd=np.asarray(z.pop("widths"),float);pn=np.asarray(z.pop("pnls"),float)
              z.update({"selected_rate":z["selected"]/len(DAYS),"entry_trade_coverage_rate":z["entry_coverage"]/z["selected"] if z["selected"] else None,"exit_trade_coverage_rate":z["exit_coverage"]/z["selected"] if z["selected"] else None,"mean_net_delta":float(nd.mean()) if nd.size else None,"mean_width":float(wd.mean()) if wd.size else None,"priced_raw_pnl_mean":float(pn.mean()) if pn.size else None,"priced_raw_pnl_sum":float(pn.sum()) if pn.size else 0.0,"priced_hit_rate":float((pn>0).mean()) if pn.size else None})
          payload={"study":"predeclared_structural_constructor_constraint_comparison","variants":VARIANTS,"selection_objective":"same net-delta-per-debit ranking as production after structural filters","primary_evaluation":"candidate availability plus selected-leg post-entry/exit trade-print coverage; P&L is secondary due sparse/asynchronous historical trades","limitations":["historical bid/ask and Greeks unavailable; pre-09:55 trade prices plus Black-Scholes delta proxies are used","trade-print coverage is a liquidity proxy, not proof of quote fillability","five recent signal days only; no parameter is promoted from P&L ranking alone"],"summary":summary,"days":days}
          Path("artifacts/monthly-backtest/constructor-constraint-diagnostic.json").write_text(json.dumps(payload,indent=2,sort_keys=True,default=str)+"\n");print(json.dumps(payload,indent=2,sort_keys=True,default=str))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: constructor-constraint-diagnostic
          path: artifacts/monthly-backtest/constructor-constraint-diagnostic.json
          if-no-files-found: error
          retention-days: 5
