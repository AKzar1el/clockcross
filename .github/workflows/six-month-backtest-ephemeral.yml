name: Six Month Backtest Ephemeral

on:
  push:
    branches:
      - research/monthly-end-to-end-backtest
    paths:
      - ".github/workflows/six-month-backtest-ephemeral.yml"

permissions:
  contents: read

env:
  ALPACA_API_KEY: ${{ secrets.ALPACA_COMPETITION_API_KEY }}
  ALPACA_SECRET_KEY: ${{ secrets.ALPACA_COMPETITION_SECRET_KEY }}
  LLM_API_KEY: ${{ secrets.CLOCKCROSS_AI_GATEWAY_BEARER }}
  LLM_BASE_URL: https://clockcross-ai-gateway.tomi-seregi99.workers.dev/v1
  LLM_MODEL: clockcross-cloudflare-llama-3.3-70b
  CLOCKCROSS_ACCOUNT_ROLE: competition
  CLOCKCROSS_ALLOW_DEV_ORDER: "false"

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: competition
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Replay actual market days March through Sep 1
        shell: bash
        run: |
          mkdir -p artifacts/monthly-backtest
          uv run python - <<'PY'
          import json
          from datetime import date, datetime, time
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import httpx
          import numpy as np
          import pandas as pd

          from clockcross.agent.adjudicator import Adjudicator, AgentContext
          from clockcross.alpaca.historical import AlpacaRestHistoryClient, HistoricalDataGateway
          from clockcross.config import Settings
          from clockcross.live_signal import LiveCoinSignalGateway, LiveSignalPolicy
          from clockcross.trading.constructor import direction_from_agent

          ET=ZoneInfo("America/New_York"); UTC=ZoneInfo("UTC")
          START=date(2026,3,2); END=date(2026,9,1); HISTORY_START=date(2025,10,1)
          FROZEN_MEAN=0.002745696957097104
          settings=Settings(); headers={"APCA-API-KEY-ID":settings.alpaca_api_key,"APCA-API-SECRET-KEY":settings.alpaca_secret_key}; http=httpx.Client(timeout=30.0)
          cal=http.get("https://paper-api.alpaca.markets/v2/calendar",params={"start":START.isoformat(),"end":END.isoformat()},headers=headers); cal.raise_for_status(); sessions=[date.fromisoformat(x["date"]) for x in cal.json()]
          rest=AlpacaRestHistoryClient(settings.alpaca_api_key,settings.alpaca_secret_key,base_url=str(settings.alpaca_data_base_url))
          hg=HistoricalDataGateway(stock_fetcher=lambda s,b,e:rest.fetch_stock_bars(s,b,e,feed=settings.historical_stock_feed),crypto_fetcher=lambda s,b,e:rest.fetch_crypto_bars(s,b,e),cache_root=None,stock_feed=settings.historical_stock_feed)
          begin=datetime.combine(HISTORY_START,time.min,tzinfo=ET).astimezone(UTC); finish=datetime.combine(END,time(12),tzinfo=ET).astimezone(UTC)
          btc=hg.fetch_crypto_minutes("BTC/USD",begin,finish); coin=hg.fetch_stock_minutes("COIN",begin,finish)
          class MH:
              @staticmethod
              def sl(f,b,e): return f.loc[(f.index>=pd.Timestamp(b))&(f.index<=pd.Timestamp(e))].copy()
              def fetch_crypto_minutes(self,s,b,e): return self.sl(btc,b,e)
              def fetch_stock_minutes(self,s,b,e): return self.sl(coin,b,e)
          policy=LiveSignalPolicy.model_validate(json.loads(Path("docs/research/2026-08-29-live-signal-policy.json").read_text()))
          sg=LiveCoinSignalGateway(history=MH(),policy=policy,history_days=120,historical_mean_signed_return=FROZEN_MEAN)
          ai=Adjudicator(base_url=str(settings.llm_base_url),api_key=settings.llm_api_key or "",model=settings.llm_model or "clockcross-cloudflare-llama-3.3-70b",timeout_seconds=30.0)
          def st(d,h,m): return pd.Timestamp(datetime.combine(d,time(h,m),tzinfo=ET).astimezone(UTC))
          def px(f,s):
              if s not in f.index:return None
              v=f.loc[s,"open"]; return None if isinstance(v,pd.Series) else float(v)
          def news(d):
              b=datetime.combine(d,time(0),tzinfo=ET).astimezone(UTC); e=datetime.combine(d,time(9,55),tzinfo=ET).astimezone(UTC)
              r=http.get("https://data.alpaca.markets/v1beta1/news",params={"symbols":"COIN","start":b.isoformat().replace("+00:00","Z"),"end":e.isoformat().replace("+00:00","Z"),"sort":"desc","limit":10,"include_content":"false"},headers=headers); r.raise_for_status()
              return [{"headline":x.get("headline"),"summary":x.get("summary"),"source":x.get("source"),"created_at":x.get("created_at")} for x in r.json().get("news",[])[:10]]
          def signed(direction,forward):
              if direction is None:return 0.0
              return forward if direction=="bullish" else -forward
          rows=[]
          for d in sessions:
              f=sg.collect_premarket(d)
              if f is None:
                  rows.append({"date":d.isoformat(),"month":d.strftime("%Y-%m"),"status":"data_abstain"}); continue
              f=sg.opening_confirmation(f)
              if f is None:
                  rows.append({"date":d.isoformat(),"month":d.strftime("%Y-%m"),"status":"data_abstain"}); continue
              ev=sg.evaluate(f)
              base={"date":d.isoformat(),"month":d.strftime("%Y-%m"),"residual":f.residual,"residual_z":ev.residual_z,"opening_10m_return":f.opening_10m_return}
              if not ev.approved:
                  rows.append({**base,"status":"threshold_abstain"}); continue
              en=px(coin,st(d,9,55)); ex=px(coin,st(d,10,55))
              if en is None or ex is None or en<=0:
                  rows.append({**base,"status":"data_abstain"}); continue
              forward=ex/en-1; sign=1 if f.residual>0 else -1; continuation="bullish" if sign>0 else "bearish"; cont=signed(continuation,forward); n=news(d)
              dec=ai.decide(AgentContext(underlying="COIN",residual=f.residual,residual_z=ev.residual_z,residual_sign=sign,btc_return=f.btc_return,opening_10m_return=f.opening_10m_return,historical_mean_signed_return=ev.historical_mean_signed_return,option_feed="indicative",available_structures=("call_debit_spread","put_debit_spread"),news_summary=json.dumps(n,sort_keys=True,default=str,separators=(",",":"))[:1600]))
              direction=direction_from_agent(dec.action,sign); ai_ret=signed(direction,forward)
              rows.append({**base,"status":"ai_abstain" if direction is None else "trade","news_count":len(n),"action":dec.action.value,"direction":direction,"confidence":dec.confidence,"driver":dec.driver.value,"idiosyncratic_news_detected":dec.idiosyncratic_news_detected,"coin_60m_return":forward,"continuation_return":cont,"ai_return":ai_ret})
          def stats(vals):
              if not vals:return {"count":0,"wins":0,"losses":0,"mean":None,"median":None,"hit_rate":None,"sum":0.0}
              a=np.asarray(vals,float); return {"count":int(a.size),"wins":int((a>0).sum()),"losses":int((a<0).sum()),"mean":float(a.mean()),"median":float(np.median(a)),"hit_rate":float((a>0).mean()),"sum":float(a.sum())}
          sig=[r for r in rows if "continuation_return" in r]; tr=[r for r in rows if r["status"]=="trade"]
          monthly={}
          for m in sorted({r["month"] for r in rows}):
              s=[r for r in sig if r["month"]==m]; t=[r for r in tr if r["month"]==m]
              monthly[m]={"market_days":sum(r["month"]==m for r in rows),"signals":len(s),"trades":len(t),"continuation":stats([r["continuation_return"] for r in s]),"ai":stats([r["ai_return"] for r in t])}
          payload={"study":"six_month_chronological_strategy_replay","window":{"start":START.isoformat(),"end":END.isoformat()},"market_day_count":len(sessions),"signal_count":len(sig),"trade_count":len(tr),"ai_abstain_count":sum(r["status"]=="ai_abstain" for r in rows),"data_abstain_count":sum(r["status"]=="data_abstain" for r in rows),"threshold_abstain_count":sum(r["status"]=="threshold_abstain" for r in rows),"continuation":stats([r["continuation_return"] for r in sig]),"ai":stats([r["ai_return"] for r in tr]),"monthly":monthly,"rows":rows,"limitations":["Current deployed AI is replayed on timestamp-capped historical Alpaca news, not the provider state that existed historically.","This layer evaluates signal/AI direction on COIN; historical option constructibility/pricing is separately proxied because Alpaca does not provide arbitrary-past option snapshot Greeks/BBO through the snapshot endpoint."]}
          Path("artifacts/monthly-backtest/six-month-strategy-replay.json").write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n"); print(json.dumps(payload,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: six-month-strategy-replay
          path: artifacts/monthly-backtest/six-month-strategy-replay.json
          if-no-files-found: error
          retention-days: 5
