name: ClockCross Cloudflare token capability ephemeral

on:
  push:
    branches:
      - feat/clockcross-core

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_READ_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
      CF_WORKERS_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
    steps:
      - name: Inspect safe token permission names
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          API = "https://api.cloudflare.com/client/v4"
          tokens = {
              "read_token": os.environ["CF_READ_TOKEN"],
              "workers_token": os.environ["CF_WORKERS_TOKEN"],
          }

          def call(url, token):
              req = urllib.request.Request(
                  url,
                  headers={"Authorization": f"Bearer {token}"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.status, json.loads(r.read().decode())
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode(errors="replace")
                  try:
                      return exc.code, json.loads(raw)
                  except Exception:
                      return exc.code, {}

          output = {}
          for label, token in tokens.items():
              verify_status, verify = call(f"{API}/user/tokens/verify", token)
              token_id = None
              if isinstance(verify, dict) and isinstance(verify.get("result"), dict):
                  token_id = verify["result"].get("id")

              detail_status = None
              permission_names = []
              if token_id:
                  detail_status, detail = call(f"{API}/user/tokens/{token_id}", token)
                  result = detail.get("result") if isinstance(detail, dict) else None
                  if isinstance(result, dict):
                      for policy in result.get("policies") or []:
                          if not isinstance(policy, dict):
                              continue
                          for group in policy.get("permission_groups") or []:
                              if isinstance(group, dict) and group.get("name"):
                                  permission_names.append(str(group["name"]))

              groups_status, groups = call(f"{API}/user/tokens/permission_groups", token)
              available_names = []
              if isinstance(groups, dict) and isinstance(groups.get("result"), list):
                  available_names = [
                      str(group.get("name"))
                      for group in groups["result"]
                      if isinstance(group, dict) and group.get("name") in {
                          "Workers AI Read",
                          "Workers AI Edit",
                          "Workers AI Write",
                          "API Tokens Read",
                          "API Tokens Edit",
                          "API Tokens Write",
                      }
                  ]

              output[label] = {
                  "verify_http": verify_status,
                  "detail_http": detail_status,
                  "permission_names": sorted(set(permission_names)),
                  "permission_groups_http": groups_status,
                  "workers_ai_groups_visible": sorted(set(available_names)),
              }

          print(json.dumps(output, indent=2, sort_keys=True))
          PY
