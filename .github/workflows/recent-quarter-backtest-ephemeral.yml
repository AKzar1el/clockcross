name: Recent Quarter Backtest Ephemeral

on:
  push:
    branches:
      - research/monthly-end-to-end-backtest
    paths:
      - ".github/workflows/recent-quarter-backtest-ephemeral.yml"

permissions:
  contents: read

env:
  ALPACA_API_KEY: ${{ secrets.ALPACA_COMPETITION_API_KEY }}
  ALPACA_SECRET_KEY: ${{ secrets.ALPACA_COMPETITION_SECRET_KEY }}
  LLM_API_KEY: ${{ secrets.CLOCKCROSS_AI_GATEWAY_BEARER }}
  LLM_BASE_URL: https://clockcross-ai-gateway.tomi-seregi99.workers.dev/v1
  LLM_MODEL: clockcross-cloudflare-llama-3.3-70b
  CLOCKCROSS_ACCOUNT_ROLE: competition
  CLOCKCROSS_ALLOW_DEV_ORDER: "false"

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: competition
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Replay every actual market day June through Sep 1
        shell: bash
        run: |
          mkdir -p artifacts/monthly-backtest
          uv run python - <<'PY'
          import json
          from collections import defaultdict
          from datetime import date, datetime, time
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import httpx
          import numpy as np
          import pandas as pd

          from clockcross.agent.adjudicator import Adjudicator, AgentContext
          from clockcross.alpaca.historical import AlpacaRestHistoryClient, HistoricalDataGateway
          from clockcross.config import Settings
          from clockcross.live_signal import LiveCoinSignalGateway, LiveSignalPolicy
          from clockcross.trading.constructor import direction_from_agent

          ET=ZoneInfo("America/New_York"); UTC=ZoneInfo("UTC")
          START=date(2026,6,1); END=date(2026,9,1); HISTORY_START=date(2026,1,15)
          FROZEN_MEAN=0.002745696957097104
          settings=Settings()
          headers={"APCA-API-KEY-ID":settings.alpaca_api_key,"APCA-API-SECRET-KEY":settings.alpaca_secret_key}
          http=httpx.Client(timeout=30.0)

          cal=http.get("https://paper-api.alpaca.markets/v2/calendar",params={"start":START.isoformat(),"end":END.isoformat()},headers=headers)
          cal.raise_for_status()
          sessions=[date.fromisoformat(x["date"]) for x in cal.json()]

          rest=AlpacaRestHistoryClient(settings.alpaca_api_key,settings.alpaca_secret_key,base_url=str(settings.alpaca_data_base_url))
          history=HistoricalDataGateway(
              stock_fetcher=lambda symbol,b,e:rest.fetch_stock_bars(symbol,b,e,feed=settings.historical_stock_feed),
              crypto_fetcher=lambda symbol,b,e:rest.fetch_crypto_bars(symbol,b,e),
              cache_root=None,stock_feed=settings.historical_stock_feed,
          )
          begin=datetime.combine(HISTORY_START,time.min,tzinfo=ET).astimezone(UTC)
          finish=datetime.combine(END,time(12,0),tzinfo=ET).astimezone(UTC)
          btc=history.fetch_crypto_minutes("BTC/USD",begin,finish); coin=history.fetch_stock_minutes("COIN",begin,finish)

          class MemoryHistory:
              @staticmethod
              def _slice(frame,start,end): return frame.loc[(frame.index>=pd.Timestamp(start))&(frame.index<=pd.Timestamp(end))].copy()
              def fetch_crypto_minutes(self,symbol,start,end): return self._slice(btc,start,end)
              def fetch_stock_minutes(self,symbol,start,end): return self._slice(coin,start,end)

          policy=LiveSignalPolicy.model_validate(json.loads(Path("docs/research/2026-08-29-live-signal-policy.json").read_text()))
          signal=LiveCoinSignalGateway(history=MemoryHistory(),policy=policy,history_days=120,historical_mean_signed_return=FROZEN_MEAN)
          ai=Adjudicator(base_url=str(settings.llm_base_url),api_key=settings.llm_api_key or "",model=settings.llm_model or "clockcross-cloudflare-llama-3.3-70b",timeout_seconds=30.0)

          def stamp(day,hh,mm): return pd.Timestamp(datetime.combine(day,time(hh,mm),tzinfo=ET).astimezone(UTC))
          def price(frame,s):
              if s not in frame.index:return None
              v=frame.loc[s,"open"]; return None if isinstance(v,pd.Series) else float(v)
          def news(day):
              start=datetime.combine(day,time(0,0),tzinfo=ET).astimezone(UTC); end=datetime.combine(day,time(9,55),tzinfo=ET).astimezone(UTC)
              r=http.get("https://data.alpaca.markets/v1beta1/news",params={"symbols":"COIN","start":start.isoformat().replace("+00:00","Z"),"end":end.isoformat().replace("+00:00","Z"),"sort":"desc","limit":10,"include_content":"false"},headers=headers)
              r.raise_for_status()
              return [{"headline":x.get("headline"),"summary":x.get("summary"),"source":x.get("source"),"created_at":x.get("created_at")} for x in r.json().get("news",[])[:10]]

          rows=[]
          for day in sessions:
              f=signal.collect_premarket(day)
              if f is None:
                  rows.append({"date":day.isoformat(),"month":day.strftime("%Y-%m"),"status":"abstain_features_unavailable"}); continue
              f=signal.opening_confirmation(f)
              if f is None:
                  rows.append({"date":day.isoformat(),"month":day.strftime("%Y-%m"),"status":"abstain_opening_unavailable"}); continue
              e=signal.evaluate(f)
              base={"date":day.isoformat(),"month":day.strftime("%Y-%m"),"residual":f.residual,"residual_abs":abs(f.residual),"residual_z":e.residual_z,"btc_return":f.btc_return,"coin_premarket_return":f.equity_premarket_return,"opening_10m_return":f.opening_10m_return,"historical_mean_signed_return":e.historical_mean_signed_return}
              if not e.approved:
                  rows.append({**base,"status":"abstain_threshold"}); continue
              entry=price(coin,stamp(day,9,55)); exitv=price(coin,stamp(day,10,55))
              if entry is None or exitv is None or entry<=0:
                  rows.append({**base,"status":"abstain_outcome_unavailable"}); continue
              forward=exitv/entry-1.0; sign=1 if f.residual>0 else -1
              cont=forward if sign>0 else -forward
              n=news(day)
              ctx=AgentContext(underlying="COIN",residual=f.residual,residual_z=e.residual_z,residual_sign=sign,btc_return=f.btc_return,opening_10m_return=f.opening_10m_return,historical_mean_signed_return=e.historical_mean_signed_return,option_feed="indicative",available_structures=("call_debit_spread","put_debit_spread"),news_summary=json.dumps(n,sort_keys=True,default=str,separators=(",",":"))[:1600])
              d=ai.decide(ctx); direction=direction_from_agent(d.action,sign)
              directional=0.0 if direction is None else (forward if direction=="bullish" else -forward)
              rows.append({**base,"status":"ai_abstain" if direction is None else "trade","news_count":len(n),"action":d.action.value,"direction":direction,"confidence":d.confidence,"driver":d.driver.value,"idiosyncratic_news_detected":d.idiosyncratic_news_detected,"reason":d.reason,"coin_60m_return":forward,"continuation_60m_return":cont,"ai_directional_60m_return":directional})

          def stats(vals):
              if not vals:return {"count":0,"wins":0,"losses":0,"mean":None,"median":None,"hit_rate":None,"sum":0.0}
              a=np.asarray(vals,float); return {"count":int(a.size),"wins":int((a>0).sum()),"losses":int((a<0).sum()),"mean":float(a.mean()),"median":float(np.median(a)),"hit_rate":float((a>0).mean()),"sum":float(a.sum())}
          signals=[r for r in rows if r.get("continuation_60m_return") is not None]
          trades=[r for r in rows if r.get("status")=="trade"]
          monthly={}
          for m in sorted({r["month"] for r in rows}):
              ms=[r for r in signals if r["month"]==m]; mt=[r for r in trades if r["month"]==m]
              monthly[m]={"market_days":sum(r["month"]==m for r in rows),"signals":len(ms),"trades":len(mt),"continuation":stats([r["continuation_60m_return"] for r in ms]),"ai_direction":stats([r["ai_directional_60m_return"] for r in mt])}
          payload={
              "study":"recent_quarter_exact_market_calendar_strategy_replay","window":{"start":START.isoformat(),"end":END.isoformat()},"frozen_research_mean":FROZEN_MEAN,"market_calendar_source":"Alpaca v2 calendar","market_day_count":len(sessions),"signal_count":len(signals),"trade_count":len(trades),"ai_abstain_count":sum(r["status"]=="ai_abstain" for r in rows),"data_abstain_count":sum(r["status"] in {"abstain_features_unavailable","abstain_opening_unavailable","abstain_outcome_unavailable"} for r in rows),"threshold_abstain_count":sum(r["status"]=="abstain_threshold" for r in rows),"continuation_stats":stats([r["continuation_60m_return"] for r in signals]),"ai_direction_stats":stats([r["ai_directional_60m_return"] for r in trades]),"monthly":monthly,"rows":rows,
              "limitations":["Historical news is timestamp-capped Alpaca news rather than a time-travel replay of the MCP response wrapper.","AI uses the current deployed model/prompt, which is the current strategy policy but not necessarily the exact provider implementation state on each historical date.","Both spread structures are assumed available in this signal/AI layer; option constructibility is tested separately."],
          }
          Path("artifacts/monthly-backtest/recent-quarter-strategy-replay.json").write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n")
          print(json.dumps(payload,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: recent-quarter-strategy-replay
          path: artifacts/monthly-backtest/recent-quarter-strategy-replay.json
          if-no-files-found: error
          retention-days: 5
