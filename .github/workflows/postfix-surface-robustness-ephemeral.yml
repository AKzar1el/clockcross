name: Post-Fix Surface Robustness Ephemeral

on:
  push:
    branches:
      - research/monthly-end-to-end-backtest
    paths:
      - ".github/workflows/postfix-surface-robustness-ephemeral.yml"

permissions:
  contents: read

env:
  ALPACA_API_KEY: ${{ secrets.ALPACA_COMPETITION_API_KEY }}
  ALPACA_SECRET_KEY: ${{ secrets.ALPACA_COMPETITION_SECRET_KEY }}
  CLOCKCROSS_ACCOUNT_ROLE: competition
  CLOCKCROSS_ALLOW_DEV_ORDER: "false"

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: competition
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Stress post-fix live indicative surface
        shell: bash
        run: |
          mkdir -p artifacts/monthly-backtest
          uv run python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from decimal import Decimal
          from pathlib import Path
          from clockcross.alpaca.options import AlpacaOptionChainRestClient
          from clockcross.config import Settings
          from clockcross.research.surface_robustness import evaluate_surface_robustness
          from clockcross.trading.risk import RiskPolicy

          settings=Settings(); now=datetime.now(timezone.utc); max_debit=settings.competition_starting_equity*RiskPolicy().per_position_loss_fraction/Decimal("100")
          client=AlpacaOptionChainRestClient(settings.alpaca_api_key,settings.alpaca_secret_key,base_url=str(settings.alpaca_data_base_url))
          chain=client.fetch_chain("COIN",feed="indicative",expiration_gte=(now+timedelta(days=7)).date(),expiration_lte=(now+timedelta(days=21)).date())
          results={}
          for direction in ("bullish","bearish"):
              results[direction]=evaluate_surface_robustness(chain,direction=direction,now=now,max_net_debit=max_debit,trials=2000,seed=20260901)
          payload={"study":"postfix_live_indicative_surface_robustness","observed_at":now.isoformat(),"min_short_abs_delta":0.10,"trials_total":12000,"results":results}
          Path("artifacts/monthly-backtest/postfix-surface-robustness.json").write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n");print(json.dumps(payload,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: postfix-surface-robustness
          path: artifacts/monthly-backtest/postfix-surface-robustness.json
          if-no-files-found: error
          retention-days: 5
