name: Recent Regime Read-Only Diagnostic

on:
  push:
    branches:
      - research/recent-regime-monetization
    paths:
      - ".github/workflows/recent-regime-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: competition
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_COMPETITION_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_COMPETITION_SECRET_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch sanitized Sep 1 order fills
        shell: bash
        run: |
          mkdir -p artifacts/diagnostic
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          headers = {
              "APCA-API-KEY-ID": os.environ["ALPACA_API_KEY"],
              "APCA-API-SECRET-KEY": os.environ["ALPACA_SECRET_KEY"],
          }
          params = {
              "status": "all",
              "after": "2026-09-01T13:50:00Z",
              "until": "2026-09-01T15:05:00Z",
              "direction": "asc",
              "nested": "true",
              "limit": 100,
          }
          url = "https://paper-api.alpaca.markets/v2/orders?" + urllib.parse.urlencode(params)
          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req, timeout=30) as response:
              payload = json.load(response)
          if not isinstance(payload, list):
              raise RuntimeError("unexpected Alpaca orders response")

          sanitized = []
          for order in payload:
              legs = order.get("legs") or []
              symbols = [str(leg.get("symbol") or "") for leg in legs]
              if order.get("order_class") != "mleg":
                  continue
              if not symbols or not all(symbol.startswith("COIN") for symbol in symbols):
                  continue
              sanitized.append({
                  "order_class": order.get("order_class"),
                  "status": order.get("status"),
                  "side": order.get("side"),
                  "type": order.get("type"),
                  "limit_price": order.get("limit_price"),
                  "filled_avg_price": order.get("filled_avg_price"),
                  "filled_qty": order.get("filled_qty"),
                  "submitted_at": order.get("submitted_at"),
                  "filled_at": order.get("filled_at"),
                  "legs": [
                      {
                          "symbol": leg.get("symbol"),
                          "side": leg.get("side"),
                          "position_intent": leg.get("position_intent"),
                          "filled_avg_price": leg.get("filled_avg_price"),
                          "filled_qty": leg.get("filled_qty"),
                      }
                      for leg in legs
                  ],
              })

          result = {
              "study": "Sep 1 exact competition order fill prices",
              "safety": "GET /v2/orders only; output omits account IDs, order IDs and client order IDs",
              "orders": sanitized,
          }
          Path("artifacts/diagnostic/sep1-order-fills.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Upload sanitized diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: recent-regime-order-fills
          path: artifacts/diagnostic/sep1-order-fills.json
          if-no-files-found: error
          retention-days: 3
