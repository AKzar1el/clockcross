name: Recent Regime Read-Only Diagnostic

on:
  push:
    branches:
      - research/recent-regime-monetization
    paths:
      - ".github/workflows/recent-regime-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: competition
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_COMPETITION_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_COMPETITION_SECRET_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch historical market data and compute sanitized diagnostics
        shell: bash
        run: |
          mkdir -p artifacts/diagnostic
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          BASE = "https://data.alpaca.markets"
          HEADERS = {
              "APCA-API-KEY-ID": os.environ["ALPACA_API_KEY"],
              "APCA-API-SECRET-KEY": os.environ["ALPACA_SECRET_KEY"],
          }
          LONG = "COIN260918C00180000"
          SHORT = "COIN260918C00192500"
          ENTRY_DEBIT = 5.23
          BAR_START = "2026-09-01T13:50:00Z"
          TRADE_START = "2026-09-01T13:20:00Z"
          END = "2026-09-01T15:00:00Z"
          ENTRY = datetime(2026, 9, 1, 13, 55, tzinfo=timezone.utc)
          TARGETS = {
              "entry_0955": "2026-09-01T13:55:00Z",
              "plus_15m": "2026-09-01T14:10:00Z",
              "plus_30m": "2026-09-01T14:25:00Z",
              "plus_45m": "2026-09-01T14:40:00Z",
              "plus_60m": "2026-09-01T14:55:00Z",
          }

          def get_pages(path, params, field):
              merged = {}
              token = None
              while True:
                  page = dict(params)
                  if token:
                      page["page_token"] = token
                  url = BASE + path + "?" + urllib.parse.urlencode(page)
                  req = urllib.request.Request(url, headers=HEADERS)
                  with urllib.request.urlopen(req, timeout=30) as response:
                      payload = json.load(response)
                  data = payload.get(field, {})
                  if isinstance(data, dict):
                      for symbol, rows in data.items():
                          merged.setdefault(symbol, []).extend(rows)
                  elif isinstance(data, list):
                      merged.setdefault("_rows", []).extend(data)
                  token = payload.get("next_page_token")
                  if not token:
                      return merged

          option_bars = get_pages(
              "/v1beta1/options/bars",
              {
                  "symbols": f"{LONG},{SHORT}",
                  "timeframe": "1Min",
                  "start": BAR_START,
                  "end": END,
                  "limit": 10000,
                  "sort": "asc",
              },
              "bars",
          )
          option_trades = get_pages(
              "/v1beta1/options/trades",
              {
                  "symbols": f"{LONG},{SHORT}",
                  "start": TRADE_START,
                  "end": END,
                  "limit": 10000,
                  "sort": "asc",
              },
              "trades",
          )
          stock_bars = get_pages(
              "/v2/stocks/bars",
              {
                  "symbols": "COIN",
                  "timeframe": "1Min",
                  "start": BAR_START,
                  "end": END,
                  "feed": "sip",
                  "limit": 10000,
                  "sort": "asc",
                  "adjustment": "raw",
              },
              "bars",
          )

          def iso_ts(row):
              return datetime.fromisoformat(row["t"].replace("Z", "+00:00")).astimezone(timezone.utc)

          def by_minute(rows):
              return {iso_ts(row).replace(second=0, microsecond=0): row for row in rows}

          def trade_summary(rows):
              parsed = [(iso_ts(row), row) for row in rows]
              pre = [(ts, row) for ts, row in parsed if ts <= ENTRY]
              post = [(ts, row) for ts, row in parsed if ENTRY < ts <= datetime(2026, 9, 1, 14, 55, tzinfo=timezone.utc)]
              last_pre = pre[-1] if pre else None
              return {
                  "total_1320_1500": len(parsed),
                  "pre_entry_count_1320_1355": len(pre),
                  "post_entry_count_1355_1455": len(post),
                  "last_pre_entry_trade_timestamp": last_pre[0].isoformat() if last_pre else None,
                  "last_pre_entry_trade_price": float(last_pre[1]["p"]) if last_pre else None,
                  "last_pre_entry_trade_age_seconds": round((ENTRY - last_pre[0]).total_seconds(), 3) if last_pre else None,
                  "first_post_entry_trade_timestamp": post[0][0].isoformat() if post else None,
                  "post_entry_trade_timestamps": [ts.isoformat() for ts, _ in post],
              }

          long_rows = option_bars.get(LONG, [])
          short_rows = option_bars.get(SHORT, [])
          coin_rows = stock_bars.get("COIN", [])
          long_map = by_minute(long_rows)
          short_map = by_minute(short_rows)
          coin_map = by_minute(coin_rows)

          common_minutes = sorted(set(long_map) & set(short_map))
          spread_path = []
          for ts in common_minutes:
              if ts < ENTRY or ts > datetime(2026, 9, 1, 14, 55, tzinfo=timezone.utc):
                  continue
              long_close = float(long_map[ts]["c"])
              short_close = float(short_map[ts]["c"])
              value = long_close - short_close
              spread_path.append({
                  "timestamp": ts.isoformat(),
                  "long_trade_bar_close": long_close,
                  "short_trade_bar_close": short_close,
                  "spread_trade_bar_proxy": round(value, 4),
                  "pnl_vs_live_entry_debit_dollars": round((value - ENTRY_DEBIT) * 100, 2),
              })

          best = max(spread_path, key=lambda row: row["spread_trade_bar_proxy"], default=None)
          worst = min(spread_path, key=lambda row: row["spread_trade_bar_proxy"], default=None)

          def exact_or_none(mapping, target):
              ts = datetime.fromisoformat(target.replace("Z", "+00:00")).replace(second=0, microsecond=0)
              return mapping.get(ts)

          target_rows = {}
          entry_coin = exact_or_none(coin_map, TARGETS["entry_0955"])
          entry_coin_close = float(entry_coin["c"]) if entry_coin else None
          for name, target in TARGETS.items():
              l = exact_or_none(long_map, target)
              s = exact_or_none(short_map, target)
              c = exact_or_none(coin_map, target)
              row = {
                  "timestamp": target,
                  "long_bar_present": l is not None,
                  "short_bar_present": s is not None,
                  "coin_bar_present": c is not None,
              }
              if l is not None:
                  row["long_trade_bar_close"] = float(l["c"])
              if s is not None:
                  row["short_trade_bar_close"] = float(s["c"])
              if l is not None and s is not None:
                  spread = float(l["c"]) - float(s["c"])
                  row["spread_trade_bar_proxy"] = round(spread, 4)
                  row["pnl_vs_live_entry_debit_dollars"] = round((spread - ENTRY_DEBIT) * 100, 2)
              if c is not None:
                  close = float(c["c"])
                  row["coin_close"] = close
                  if entry_coin_close:
                      row["coin_return_from_0955"] = round(close / entry_coin_close - 1.0, 8)
              target_rows[name] = row

          trade_activity = {
              LONG: trade_summary(option_trades.get(LONG, [])),
              SHORT: trade_summary(option_trades.get(SHORT, [])),
          }
          result = {
              "study": "Sep 1 exact executed spread historical trade activity and trade-bar path",
              "safety": "read-only historical market-data endpoints only; no trading client or order endpoint",
              "limitations": [
                  "Historical option bars/trades are trade-derived observations, not arbitrary-past BBO snapshots.",
                  "The live entry debit is taken from the persisted competition ledger; historical trades are not claimed as executable quotes.",
                  "Only same-minute bars for both legs are used for spread-path comparisons.",
              ],
              "session_date": "2026-09-01",
              "long_symbol": LONG,
              "short_symbol": SHORT,
              "live_entry_debit": ENTRY_DEBIT,
              "live_exit_stored_limit_credit": 4.55,
              "trade_activity": trade_activity,
              "option_bar_counts": {LONG: len(long_rows), SHORT: len(short_rows)},
              "same_minute_spread_observations_0955_1055": len(spread_path),
              "best_same_minute_trade_bar_proxy": best,
              "worst_same_minute_trade_bar_proxy": worst,
              "targets": target_rows,
              "spread_path": spread_path,
          }
          Path("artifacts/diagnostic/sep1-spread-path.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps({
              "trade_activity": trade_activity,
              "option_bar_counts": result["option_bar_counts"],
              "same_minute_observations": result["same_minute_spread_observations_0955_1055"],
              "best": best,
              "targets": target_rows,
          }, indent=2, sort_keys=True))
          PY

      - name: Upload sanitized diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: recent-regime-diagnostic
          path: artifacts/diagnostic/sep1-spread-path.json
          if-no-files-found: error
          retention-days: 3
