name: ClockCross Cloudflare AI probe ephemeral

on:
  push:
    branches:
      - feat/clockcross-core

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_READ_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
      CF_WORKERS_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
    steps:
      - name: Probe Workers AI permissions without exposing identifiers
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          API = "https://api.cloudflare.com/client/v4"
          tokens = {
              "read_token": os.environ["CF_READ_TOKEN"],
              "workers_token": os.environ["CF_WORKERS_TOKEN"],
          }

          def call(method, url, token, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, json.loads(r.read().decode())
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode(errors="replace")
                  try:
                      payload = json.loads(raw)
                  except Exception:
                      payload = {"errors": [{"code": "non_json_error"}]}
                  return exc.code, payload

          account_ids = []
          account_results = {}
          for label, token in tokens.items():
              status, payload = call("GET", f"{API}/accounts?per_page=50", token)
              results = payload.get("result") if isinstance(payload, dict) else None
              ids = [str(x.get("id")) for x in results or [] if isinstance(x, dict) and x.get("id")]
              for account_id in ids:
                  if account_id not in account_ids:
                      account_ids.append(account_id)
              account_results[label] = {"http": status, "account_count": len(ids)}

          ai_results = {}
          for label, token in tokens.items():
              attempts = []
              for account_id in account_ids:
                  status, payload = call(
                      "POST",
                      f"{API}/accounts/{account_id}/ai/v1/chat/completions",
                      token,
                      {
                          "model": "@cf/meta/llama-3.1-8b-instruct",
                          "messages": [
                              {"role": "system", "content": "Reply with exactly OK."},
                              {"role": "user", "content": "Health check"},
                          ],
                          "temperature": 0,
                          "max_tokens": 8,
                      },
                  )
                  success = status == 200 and isinstance(payload, dict) and bool(payload.get("choices"))
                  errors = []
                  if isinstance(payload, dict):
                      for error in payload.get("errors") or []:
                          if isinstance(error, dict):
                              errors.append(error.get("code"))
                  attempts.append({"http": status, "success": success, "error_codes": errors})
                  if success:
                      break
              ai_results[label] = attempts

          print(json.dumps({
              "accounts_discovered": len(account_ids),
              "account_listing": account_results,
              "workers_ai": ai_results,
          }, indent=2, sort_keys=True))
          PY
