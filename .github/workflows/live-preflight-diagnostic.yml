name: ClockCross live preflight diagnostic

on:
  push:
    branches:
      - feat/clockcross-core

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      CLOCKCROSS_ACCOUNT_ROLE: development
      CLOCKCROSS_ALLOW_DEV_ORDER: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Sanitize Alpaca account/configuration diagnostic
        shell: bash
        run: |
          uv run python - <<'PY'
          import json, os
          import httpx

          headers = {
              "APCA-API-KEY-ID": os.environ["ALPACA_API_KEY"],
              "APCA-API-SECRET-KEY": os.environ["ALPACA_SECRET_KEY"],
          }
          base = "https://paper-api.alpaca.markets"
          with httpx.Client(timeout=20) as client:
              account = client.get(base + "/v2/account", headers=headers)
              account.raise_for_status()
              account = account.json()
              config = client.get(base + "/v2/account/configurations", headers=headers)
              config.raise_for_status()
              config = config.json()
          print(json.dumps({
              "account": {
                  "status": account.get("status"),
                  "trading_blocked": account.get("trading_blocked"),
                  "options_approved_level": account.get("options_approved_level"),
                  "options_trading_level": account.get("options_trading_level"),
              },
              "configuration": {
                  "keys": sorted(config.keys()),
                  "max_options_trading_level": config.get("max_options_trading_level"),
              },
          }, indent=2, sort_keys=True))
          PY
      - name: Run read-only ClockCross preflight
        shell: bash
        run: |
          set +e
          uv run clockcross preflight
          rc=$?
          echo "CLOCKCROSS_PREFLIGHT_EXIT=$rc"
          exit 0
