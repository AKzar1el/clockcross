name: ClockCross Cloudflare AI binding probe ephemeral

on:
  push:
    branches:
      - feat/clockcross-core

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
    steps:
      - name: Probe Workers AI binding through Wrangler remote development
        shell: bash
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          cd "$dir"
          mkdir -p src
          cat > wrangler.jsonc <<'JSON'
          {
            "name": "clockcross-ai-binding-probe-20260830",
            "main": "src/index.js",
            "compatibility_date": "2026-08-30",
            "ai": { "binding": "AI", "remote": true }
          }
          JSON
          cat > src/index.js <<'JS'
          export default {
            async fetch(_request, env) {
              try {
                const result = await env.AI.run("@cf/meta/llama-3.1-8b-instruct", {
                  messages: [
                    { role: "system", content: "Reply with exactly OK." },
                    { role: "user", content: "Health check" }
                  ],
                  temperature: 0,
                  max_tokens: 8
                });
                const text = result?.response ?? result?.choices?.[0]?.message?.content ?? "";
                return Response.json({ ok: Boolean(text), response_kind: typeof result, text_present: Boolean(text) });
              } catch (error) {
                return Response.json({ ok: false, error_name: error?.name ?? "Error" }, { status: 500 });
              }
            }
          };
          JS

          npx --yes wrangler@latest dev --remote --port 8787 --config wrangler.jsonc >/tmp/cf-remote-dev.log 2>&1 &
          pid=$!
          cleanup() {
            set +e
            kill "$pid" >/dev/null 2>&1
            wait "$pid" >/dev/null 2>&1
            echo "REMOTE_DEV_CLEANUP_ATTEMPTED=true"
          }
          trap cleanup EXIT

          success=false
          http="000"
          for attempt in $(seq 1 30); do
            if ! kill -0 "$pid" >/dev/null 2>&1; then
              break
            fi
            set +e
            http="$(curl -sS -o /tmp/cf-ai-result.json -w '%{http_code}' http://127.0.0.1:8787/)"
            curl_rc=$?
            set -e
            if [ "$curl_rc" -eq 0 ] && [ "$http" != "000" ]; then
              success=true
              break
            fi
            sleep 2
          done

          echo "REMOTE_DEV_HTTP=$http"
          echo "REMOTE_DEV_REACHABLE=$success"
          if [ "$success" != "true" ]; then
            tail -n 80 /tmp/cf-remote-dev.log || true
            exit 0
          fi

          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('/tmp/cf-ai-result.json')
          try:
              payload = json.loads(path.read_text())
          except Exception:
              payload = {}
          print(json.dumps({
              'ai_binding_ok': bool(payload.get('ok')),
              'response_kind': payload.get('response_kind'),
              'text_present': bool(payload.get('text_present')),
              'error_name': payload.get('error_name'),
          }, sort_keys=True))
          PY
