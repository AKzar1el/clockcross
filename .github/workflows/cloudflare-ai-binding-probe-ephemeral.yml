name: ClockCross Cloudflare AI binding probe ephemeral

on:
  push:
    branches:
      - feat/clockcross-core

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
    steps:
      - name: Probe Llama structured decision through remote AI binding
        shell: bash
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          cd "$dir"
          mkdir -p src
          cat > wrangler.jsonc <<'JSON'
          {
            "name": "clockcross-ai-binding-probe-20260830",
            "main": "src/index.js",
            "compatibility_date": "2026-08-30",
            "ai": { "binding": "AI", "remote": true }
          }
          JSON
          cat > src/index.js <<'JS'
          const schema = {
            type: "object",
            additionalProperties: false,
            properties: {
              action: { type: "string", enum: ["continuation", "reversion", "abstain"] },
              confidence: { type: "number", minimum: 0, maximum: 1 },
              idiosyncratic_news_detected: { type: "boolean" },
              driver: { type: "string", enum: ["crypto_cross_market", "company_specific", "macro", "unclear"] },
              reason: { type: "string", maxLength: 400 }
            },
            required: ["action", "confidence", "idiosyncratic_news_detected", "driver", "reason"]
          };

          export default {
            async fetch(_request, env) {
              try {
                const result = await env.AI.run("@cf/meta/llama-3.3-70b-instruct-fp8-fast", {
                  messages: [
                    { role: "system", content: "Return a conservative ClockCross trading decision. JSON only." },
                    { role: "user", content: "COIN residual +1.5%, BTC +2%, no company-specific news. Choose continuation, reversion, or abstain." }
                  ],
                  response_format: { type: "json_schema", json_schema: schema },
                  temperature: 0,
                  max_tokens: 180
                });
                const candidate = result?.response ?? result?.choices?.[0]?.message?.content ?? result?.choices?.[0]?.text;
                let parsed = candidate;
                if (typeof parsed === "string") parsed = JSON.parse(parsed);
                const keys = parsed && typeof parsed === "object" ? Object.keys(parsed).sort() : [];
                const required = ["action", "confidence", "driver", "idiosyncratic_news_detected", "reason"].sort();
                const ok = JSON.stringify(keys) === JSON.stringify(required)
                  && ["continuation", "reversion", "abstain"].includes(parsed.action)
                  && typeof parsed.confidence === "number"
                  && typeof parsed.idiosyncratic_news_detected === "boolean";
                return Response.json({ ok, keys, action_valid: ok && Boolean(parsed.action) });
              } catch (error) {
                return Response.json({ ok: false, error_name: error?.name ?? "Error", error_message: String(error?.message ?? "").slice(0, 240) }, { status: 500 });
              }
            }
          };
          JS

          npx --yes wrangler@latest dev --remote --port 8787 --config wrangler.jsonc >/tmp/cf-remote-dev.log 2>&1 &
          pid=$!
          cleanup() {
            set +e
            kill "$pid" >/dev/null 2>&1
            wait "$pid" >/dev/null 2>&1
            echo "REMOTE_DEV_CLEANUP_ATTEMPTED=true"
          }
          trap cleanup EXIT

          success=false
          http="000"
          for attempt in $(seq 1 30); do
            if ! kill -0 "$pid" >/dev/null 2>&1; then
              break
            fi
            set +e
            http="$(curl -sS -o /tmp/cf-ai-result.json -w '%{http_code}' http://127.0.0.1:8787/)"
            curl_rc=$?
            set -e
            if [ "$curl_rc" -eq 0 ] && [ "$http" != "000" ]; then
              success=true
              break
            fi
            sleep 2
          done

          echo "REMOTE_DEV_HTTP=$http"
          echo "REMOTE_DEV_REACHABLE=$success"
          if [ "$success" != "true" ]; then
            tail -n 80 /tmp/cf-remote-dev.log || true
            exit 0
          fi

          python - <<'PY'
          import json
          from pathlib import Path
          try:
              payload = json.loads(Path('/tmp/cf-ai-result.json').read_text())
          except Exception:
              payload = {}
          print(json.dumps({
              'structured_decision_ok': bool(payload.get('ok')),
              'keys': payload.get('keys'),
              'action_valid': bool(payload.get('action_valid')),
              'error_name': payload.get('error_name'),
              'error_message': payload.get('error_message'),
          }, sort_keys=True))
          PY
