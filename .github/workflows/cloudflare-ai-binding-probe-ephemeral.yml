name: ClockCross Cloudflare AI binding probe ephemeral

on:
  push:
    branches:
      - feat/clockcross-core

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
    steps:
      - name: Probe Qwen3 through Wrangler remote AI binding
        shell: bash
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          cd "$dir"
          mkdir -p src
          cat > wrangler.jsonc <<'JSON'
          {
            "name": "clockcross-ai-binding-probe-20260830",
            "main": "src/index.js",
            "compatibility_date": "2026-08-30",
            "ai": { "binding": "AI", "remote": true }
          }
          JSON
          cat > src/index.js <<'JS'
          export default {
            async fetch(_request, env) {
              try {
                const result = await env.AI.run("@cf/qwen/qwen3-30b-a3b-fp8", {
                  messages: [
                    { role: "system", content: "Reply with exactly OK." },
                    { role: "user", content: "Health check" }
                  ],
                  chat_template_kwargs: { enable_thinking: false },
                  temperature: 0,
                  max_tokens: 32
                });
                const responseText = typeof result?.response === "string" ? result.response : "";
                const choiceText = result?.choices?.[0]?.message?.content ?? "";
                const text = responseText || choiceText;
                return Response.json({
                  ok: Boolean(text),
                  choice_text_present: Boolean(choiceText),
                  response_text_present: Boolean(responseText),
                  result_keys: result && typeof result === "object" ? Object.keys(result).sort() : []
                });
              } catch (error) {
                return Response.json({
                  ok: false,
                  error_name: error?.name ?? "Error",
                  error_message: String(error?.message ?? "").slice(0, 240)
                }, { status: 500 });
              }
            }
          };
          JS

          npx --yes wrangler@latest dev --remote --port 8787 --config wrangler.jsonc >/tmp/cf-remote-dev.log 2>&1 &
          pid=$!
          cleanup() {
            set +e
            kill "$pid" >/dev/null 2>&1
            wait "$pid" >/dev/null 2>&1
            echo "REMOTE_DEV_CLEANUP_ATTEMPTED=true"
          }
          trap cleanup EXIT

          success=false
          http="000"
          for attempt in $(seq 1 30); do
            if ! kill -0 "$pid" >/dev/null 2>&1; then
              break
            fi
            set +e
            http="$(curl -sS -o /tmp/cf-ai-result.json -w '%{http_code}' http://127.0.0.1:8787/)"
            curl_rc=$?
            set -e
            if [ "$curl_rc" -eq 0 ] && [ "$http" != "000" ]; then
              success=true
              break
            fi
            sleep 2
          done

          echo "REMOTE_DEV_HTTP=$http"
          echo "REMOTE_DEV_REACHABLE=$success"
          if [ "$success" != "true" ]; then
            tail -n 80 /tmp/cf-remote-dev.log || true
            exit 0
          fi

          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('/tmp/cf-ai-result.json')
          try:
              payload = json.loads(path.read_text())
          except Exception:
              payload = {}
          print(json.dumps({
              'ai_binding_ok': bool(payload.get('ok')),
              'choice_text_present': bool(payload.get('choice_text_present')),
              'response_text_present': bool(payload.get('response_text_present')),
              'result_keys': payload.get('result_keys'),
              'error_name': payload.get('error_name'),
              'error_message': payload.get('error_message'),
          }, sort_keys=True))
          PY
