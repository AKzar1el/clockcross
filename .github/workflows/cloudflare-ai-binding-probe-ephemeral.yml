name: ClockCross Cloudflare AI binding probe ephemeral

on:
  push:
    branches:
      - feat/clockcross-core

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
    steps:
      - name: Deploy, invoke, and delete disposable AI-bound Worker
        shell: bash
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          cd "$dir"
          mkdir -p src
          cat > wrangler.jsonc <<'JSON'
          {
            "name": "clockcross-ai-binding-probe-20260830",
            "main": "src/index.js",
            "compatibility_date": "2026-08-30",
            "ai": { "binding": "AI" }
          }
          JSON
          cat > src/index.js <<'JS'
          export default {
            async fetch(_request, env) {
              try {
                const result = await env.AI.run("@cf/meta/llama-3.1-8b-instruct", {
                  messages: [
                    { role: "system", content: "Reply with exactly OK." },
                    { role: "user", content: "Health check" }
                  ],
                  temperature: 0,
                  max_tokens: 8
                });
                const text = result?.response ?? result?.choices?.[0]?.message?.content ?? "";
                return Response.json({ ok: Boolean(text), response_kind: typeof result, text_present: Boolean(text) });
              } catch (error) {
                return Response.json({ ok: false, error_name: error?.name ?? "Error" }, { status: 500 });
              }
            }
          };
          JS

          cleanup() {
            set +e
            printf 'y\n' | npx --yes wrangler@latest delete --config wrangler.jsonc >/tmp/cf-delete.log 2>&1
            echo "WORKER_CLEANUP_ATTEMPTED=true"
          }
          trap cleanup EXIT

          set +e
          npx --yes wrangler@latest deploy --config wrangler.jsonc 2>&1 | tee /tmp/cf-deploy.log
          deploy_rc=${PIPESTATUS[0]}
          set -e
          echo "WORKER_DEPLOY_EXIT=$deploy_rc"
          if [ "$deploy_rc" -ne 0 ]; then
            exit 0
          fi

          url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/cf-deploy.log | tail -1 || true)"
          if [ -z "$url" ]; then
            echo "WORKER_URL_DISCOVERED=false"
            exit 0
          fi
          echo "WORKER_URL_DISCOVERED=true"

          set +e
          http="$(curl -sS -o /tmp/cf-ai-result.json -w '%{http_code}' "$url")"
          curl_rc=$?
          set -e
          echo "WORKER_HTTP=$http"
          echo "WORKER_CURL_EXIT=$curl_rc"
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('/tmp/cf-ai-result.json')
          if not path.exists():
              print(json.dumps({'ai_binding_result': 'no_response'}))
          else:
              try:
                  payload = json.loads(path.read_text())
              except Exception:
                  payload = {}
              print(json.dumps({
                  'ai_binding_ok': bool(payload.get('ok')),
                  'response_kind': payload.get('response_kind'),
                  'text_present': bool(payload.get('text_present')),
                  'error_name': payload.get('error_name'),
              }, sort_keys=True))
          PY
