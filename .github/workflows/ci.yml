name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Alpaca MCP runtime compatibility
        run: >-
          uv run --no-project
          --with "alpaca-mcp-server==2.2.0"
          --with "fastmcp==3.4.7"
          python -c "import alpaca_mcp_server.server; from fastmcp.tools.tool import ToolResult; assert ToolResult is not None"
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy src/clockcross
      - name: Tests
        run: uv run pytest -q
