name: Temporary Competition Diagnostic

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: competition
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_COMPETITION_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_COMPETITION_SECRET_KEY }}
      LLM_API_KEY: ${{ secrets.CLOCKCROSS_AI_GATEWAY_BEARER }}
      LLM_BASE_URL: https://clockcross-ai-gateway.tomi-seregi99.workers.dev/v1
      LLM_MODEL: clockcross-cloudflare-llama-3.3-70b
      CLOCKCROSS_ACCOUNT_ROLE: competition
      CLOCKCROSS_ALLOW_DEV_ORDER: "false"
      DB_PATH: data/diagnostic.sqlite3

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Read-only Alpaca competition snapshot
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from collections import Counter
          from datetime import datetime
          from zoneinfo import ZoneInfo

          base = "https://paper-api.alpaca.markets"
          headers = {
              "APCA-API-KEY-ID": os.environ["ALPACA_API_KEY"],
              "APCA-API-SECRET-KEY": os.environ["ALPACA_SECRET_KEY"],
          }

          def get(path):
              request = urllib.request.Request(base + path, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.loads(response.read().decode("utf-8"))

          account = get("/v2/account")
          positions = get("/v2/positions")
          orders = get("/v2/orders?" + urllib.parse.urlencode({
              "status": "all",
              "limit": 500,
              "direction": "asc",
              "nested": "true",
          }))
          clock = get("/v2/clock")
          et = ZoneInfo("America/New_York")
          today = datetime.now(et).date().isoformat()
          today_orders = [
              order for order in orders
              if str(order.get("created_at", "")).startswith(today)
          ]
          print(json.dumps({
              "account_status": account.get("status"),
              "equity": account.get("equity"),
              "portfolio_value": account.get("portfolio_value"),
              "cash": account.get("cash"),
              "trading_blocked": account.get("trading_blocked"),
              "options_approved_level": account.get("options_approved_level"),
              "options_trading_level": account.get("options_trading_level"),
              "orders_total": len(orders),
              "orders_today": len(today_orders),
              "today_order_statuses": dict(Counter(str(o.get("status")) for o in today_orders)),
              "positions_open": len(positions),
              "market_is_open": clock.get("is_open"),
              "market_timestamp": clock.get("timestamp"),
          }, sort_keys=True))
          PY

      - name: Read-only external preflight
        run: uv run clockcross preflight

      - name: Re-evaluate today's frozen signal without order submission
        run: uv run clockcross run-once --date 2026-08-31 --mode dry-run
