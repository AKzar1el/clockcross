name: Featherless Research Bakeoff

on:
  push:
    branches:
      - research/featherless-bakeoff-2026-09-03
    paths:
      - .github/workflows/featherless-bakeoff.yml
      - artifacts/research/featherless-bakeoff-protocol-2026-09-03.json
      - ops/featherless-bakeoff.py
      - ops/featherless_bakeoff/**
      - src/clockcross/research/featherless_bakeoff.py
      - tests/unit/test_featherless_bakeoff.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bakeoff:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      FEATHERLESS_API_KEY: ${{ secrets.FEATHERLESS_API_KEY }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: https://clockcross-ai-gateway.tomi-seregi99.workers.dev/v1
      LLM_MODEL: clockcross-cloudflare-llama-3.3-70b
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Verify required credentials without printing them
        shell: bash
        run: |
          set -euo pipefail
          for name in ALPACA_API_KEY ALPACA_SECRET_KEY FEATHERLESS_API_KEY LLM_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: ${name}" >&2
              exit 1
            fi
          done
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy src/clockcross
      - name: Tests
        run: uv run pytest -q
      - name: Run predeclared read-only bakeoff
        run: >-
          uv run python ops/featherless-bakeoff.py
          --output artifacts/research/featherless-bakeoff-live-2026-09-03.json
      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: featherless-bakeoff-2026-09-03
          path: artifacts/research/featherless-bakeoff-live-2026-09-03.json
          if-no-files-found: warn
          retention-days: 30
