name: ClockCross MLeg closed-market proof ephemeral

on:
  push:
    branches:
      - feat/clockcross-core

permissions:
  contents: read

jobs:
  prove-closed-market-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      CLOCKCROSS_ACCOUNT_ROLE: development
      CLOCKCROSS_ALLOW_DEV_ORDER: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Prove smoke command refuses while U.S. market is closed
        shell: bash
        run: |
          set +e
          output="$(uv run clockcross smoke-mleg 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          if [ "$rc" -eq 0 ]; then
            echo "Smoke command unexpectedly succeeded while the market should be closed" >&2
            exit 1
          fi
          printf '%s\n' "$output" | grep -F "U.S. market is not open; refusing MLeg smoke"
          echo "CLOCKCROSS_CLOSED_MARKET_REFUSAL=true"
