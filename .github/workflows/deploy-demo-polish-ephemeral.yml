name: ClockCross polished demo deploy ephemeral

on:
  push:
    branches:
      - feat/clockcross-core

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy and verify polished judge demo
        shell: bash
        run: |
          set -euo pipefail
          cd deploy/cloudflare-demo
          npx --yes wrangler@latest deploy --config wrangler.jsonc 2>&1 | tee /tmp/clockcross-demo-deploy.log

          url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/clockcross-demo-deploy.log | tail -1 || true)"
          if [ -z "$url" ]; then
            echo "Judge demo URL was not discovered from Wrangler output" >&2
            exit 1
          fi
          echo "CLOCKCROSS_DEMO_URL=$url"

          root_ready=false
          for attempt in $(seq 1 30); do
            http="$(curl -sS -o /tmp/index.html -w '%{http_code}' "$url/" || true)"
            if [ "$http" = "200" ] \
              && grep -Fq "Evidence, not promises." /tmp/index.html \
              && grep -Fq "MUTATE" /tmp/index.html \
              && grep -Fq 'class="hero-inner shell"' /tmp/index.html \
              && grep -Fq 'og-image.png' /tmp/index.html; then
              root_ready=true
              break
            fi
            sleep 2
          done
          echo "CHECK /=${root_ready}"
          [ "$root_ready" = "true" ]

          check() {
            local path="$1"
            local target="$2"
            local ok=false
            for attempt in $(seq 1 30); do
              http="$(curl -sS -o "$target" -w '%{http_code}' "$url$path" || true)"
              if [ "$http" = "200" ]; then
                ok=true
                break
              fi
              sleep 2
            done
            echo "CHECK $path=$ok"
            [ "$ok" = "true" ]
          }

          check /favicon.svg /tmp/favicon.svg
          check /site.webmanifest /tmp/site.webmanifest
          check /og-image.png /tmp/og-image.png
          check /hackathon-cover.png /tmp/hackathon-cover.png

          grep -Fq 'ClockCross' /tmp/site.webmanifest
          python - <<'PY'
          from pathlib import Path
          assert Path('/tmp/og-image.png').read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
          assert Path('/tmp/hackathon-cover.png').read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
          PY
          echo "CLOCKCROSS_DEMO_PUBLIC=true"
