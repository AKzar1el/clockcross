name: AI Reversion Guard Diagnostic Ephemeral

on:
  push:
    branches:
      - research/monthly-end-to-end-backtest
    paths:
      - ".github/workflows/ai-reversion-guard-diagnostic-ephemeral.yml"

permissions:
  contents: read

env:
  ALPACA_API_KEY: ${{ secrets.ALPACA_COMPETITION_API_KEY }}
  ALPACA_SECRET_KEY: ${{ secrets.ALPACA_COMPETITION_SECRET_KEY }}
  LLM_API_KEY: ${{ secrets.CLOCKCROSS_AI_GATEWAY_BEARER }}
  LLM_BASE_URL: https://clockcross-ai-gateway.tomi-seregi99.workers.dev/v1
  LLM_MODEL: clockcross-cloudflare-llama-3.3-70b
  CLOCKCROSS_ACCOUNT_ROLE: competition
  CLOCKCROSS_ALLOW_DEV_ORDER: "false"

jobs:
  guard-study:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: competition
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Test predeclared reversion confirmation semantics
        shell: bash
        run: |
          mkdir -p artifacts/monthly-backtest
          uv run python - <<'PY'
          import json
          from datetime import date, datetime, time
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import httpx
          import numpy as np
          import pandas as pd
          from clockcross.agent.adjudicator import Adjudicator, AgentContext, AgentAction
          from clockcross.alpaca.historical import AlpacaRestHistoryClient, HistoricalDataGateway
          from clockcross.config import Settings
          from clockcross.live_signal import LiveCoinSignalGateway, LiveSignalPolicy
          from clockcross.trading.constructor import direction_from_agent

          ET=ZoneInfo("America/New_York"); UTC=ZoneInfo("UTC")
          START=date(2026,6,1); END=date(2026,9,1); HISTORY_START=date(2026,1,15)
          FROZEN_MEAN=0.002745696957097104
          settings=Settings(); headers={"APCA-API-KEY-ID":settings.alpaca_api_key,"APCA-API-SECRET-KEY":settings.alpaca_secret_key}; http=httpx.Client(timeout=30.0)
          cal=http.get("https://paper-api.alpaca.markets/v2/calendar",params={"start":START.isoformat(),"end":END.isoformat()},headers=headers);cal.raise_for_status();sessions=[date.fromisoformat(x["date"]) for x in cal.json()]
          rest=AlpacaRestHistoryClient(settings.alpaca_api_key,settings.alpaca_secret_key,base_url=str(settings.alpaca_data_base_url))
          hg=HistoricalDataGateway(stock_fetcher=lambda s,b,e:rest.fetch_stock_bars(s,b,e,feed=settings.historical_stock_feed),crypto_fetcher=lambda s,b,e:rest.fetch_crypto_bars(s,b,e),cache_root=None,stock_feed=settings.historical_stock_feed)
          begin=datetime.combine(HISTORY_START,time.min,tzinfo=ET).astimezone(UTC);finish=datetime.combine(END,time(12,0),tzinfo=ET).astimezone(UTC)
          btc=hg.fetch_crypto_minutes("BTC/USD",begin,finish);coin=hg.fetch_stock_minutes("COIN",begin,finish)
          class MH:
              @staticmethod
              def sl(f,b,e):return f.loc[(f.index>=pd.Timestamp(b))&(f.index<=pd.Timestamp(e))].copy()
              def fetch_crypto_minutes(self,s,b,e):return self.sl(btc,b,e)
              def fetch_stock_minutes(self,s,b,e):return self.sl(coin,b,e)
          policy=LiveSignalPolicy.model_validate(json.loads(Path("docs/research/2026-08-29-live-signal-policy.json").read_text()))
          sg=LiveCoinSignalGateway(history=MH(),policy=policy,history_days=120,historical_mean_signed_return=FROZEN_MEAN)
          ai=Adjudicator(base_url=str(settings.llm_base_url),api_key=settings.llm_api_key or "",model=settings.llm_model or "clockcross-cloudflare-llama-3.3-70b",timeout_seconds=30.0)
          def st(d,h,m):return pd.Timestamp(datetime.combine(d,time(h,m),tzinfo=ET).astimezone(UTC))
          def px(f,s):
              if s not in f.index:return None
              v=f.loc[s,"open"];return None if isinstance(v,pd.Series) else float(v)
          def news(d):
              b=datetime.combine(d,time(0),tzinfo=ET).astimezone(UTC);e=datetime.combine(d,time(9,55),tzinfo=ET).astimezone(UTC)
              r=http.get("https://data.alpaca.markets/v1beta1/news",params={"symbols":"COIN","start":b.isoformat().replace("+00:00","Z"),"end":e.isoformat().replace("+00:00","Z"),"sort":"desc","limit":10,"include_content":"false"},headers=headers);r.raise_for_status()
              return [{"headline":x.get("headline"),"summary":x.get("summary"),"source":x.get("source"),"created_at":x.get("created_at")} for x in r.json().get("news",[])[:10]]
          def signed(direction,forward):
              if direction is None:return 0.0
              return forward if direction=="bullish" else -forward
          rows=[]
          for d in sessions:
              f=sg.collect_premarket(d)
              if f is None:continue
              f=sg.opening_confirmation(f)
              if f is None:continue
              ev=sg.evaluate(f)
              if not ev.approved:continue
              en=px(coin,st(d,9,55));ex=px(coin,st(d,10,55))
              if en is None or ex is None or en<=0:continue
              forward=ex/en-1;rs=1 if f.residual>0 else -1;n=news(d)
              dec=ai.decide(AgentContext(underlying="COIN",residual=f.residual,residual_z=ev.residual_z,residual_sign=rs,btc_return=f.btc_return,opening_10m_return=f.opening_10m_return,historical_mean_signed_return=ev.historical_mean_signed_return,option_feed="indicative",available_structures=("call_debit_spread","put_debit_spread"),news_summary=json.dumps(n,sort_keys=True,default=str,separators=(",",":"))[:1600]))
              current=direction_from_agent(dec.action,rs)
              continuation="bullish" if rs>0 else "bearish"
              reversion="bearish" if rs>0 else "bullish"
              opening_sign=1 if f.opening_10m_return>0 else (-1 if f.opening_10m_return<0 else 0)
              reversion_sign=1 if reversion=="bullish" else -1
              opening_supports_reversion=(opening_sign==reversion_sign)
              fallback=current; abstain=current
              if dec.action==AgentAction.REVERSION and not opening_supports_reversion:
                  fallback=continuation
                  abstain=None
              rows.append({"date":d.isoformat(),"month":d.strftime("%Y-%m"),"residual":f.residual,"residual_z":ev.residual_z,"opening_10m_return":f.opening_10m_return,"action":dec.action.value,"current_direction":current,"opening_supports_reversion":opening_supports_reversion if dec.action==AgentAction.REVERSION else None,"coin_60m_return":forward,"continuation_return":signed(continuation,forward),"current_ai_return":signed(current,forward),"guard_fallback_return":signed(fallback,forward),"guard_abstain_return":signed(abstain,forward),"guard_fallback_direction":fallback,"guard_abstain_direction":abstain})
          def stats(vals):
              if not vals:return {"count":0,"wins":0,"losses":0,"mean":None,"median":None,"hit_rate":None,"sum":0.0}
              a=np.asarray(vals,float);return {"count":int(a.size),"wins":int((a>0).sum()),"losses":int((a<0).sum()),"mean":float(a.mean()),"median":float(np.median(a)),"hit_rate":float((a>0).mean()),"sum":float(a.sum())}
          def metric(key,exclude_zero=False):
              vals=[r[key] for r in rows if not (exclude_zero and r[key]==0.0)]
              return stats(vals)
          monthly={}
          for m in sorted({r["month"] for r in rows}):
              mr=[r for r in rows if r["month"]==m]
              monthly[m]={}
              for key in ("continuation_return","current_ai_return","guard_fallback_return","guard_abstain_return"):
                  vals=[r[key] for r in mr if not (key=="guard_abstain_return" and r[key]==0.0)]
                  monthly[m][key]=stats(vals)
          payload={
              "study":"opening_confirmed_ai_reversion_guard",
              "rule":"AI continuation remains unchanged. AI abstain remains abstain. AI reversion is accepted only when the sign of the already-known 09:30-09:40 COIN opening return matches the reversion direction.",
              "variants":{"fallback":"unsupported reversion falls back to frozen continuation direction","abstain":"unsupported reversion fails closed / no trade"},
              "promotion_gate":"No production change from this diagnostic unless a guard improves the current AI over the full window and does not destroy the positive August regime; no z-score or threshold search is allowed.",
              "signal_count":len(rows),
              "reversion_count":sum(r["action"]=="reversion" for r in rows),
              "unsupported_reversion_count":sum(r["action"]=="reversion" and not r["opening_supports_reversion"] for r in rows),
              "overall":{"continuation":metric("continuation_return"),"current_ai":metric("current_ai_return",exclude_zero=True),"guard_fallback":metric("guard_fallback_return"),"guard_abstain":metric("guard_abstain_return",exclude_zero=True)},
              "monthly":monthly,"rows":rows,
              "limitations":["Uses current deployed AI policy on timestamp-capped historical context, not the historical provider state.","This tests one predeclared structural confirmation rule only; it is not a search over opening-return magnitudes."],
          }
          Path("artifacts/monthly-backtest/ai-reversion-guard.json").write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n");print(json.dumps(payload,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ai-reversion-guard
          path: artifacts/monthly-backtest/ai-reversion-guard.json
          if-no-files-found: error
          retention-days: 5
