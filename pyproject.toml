[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clockcross"
version = "0.1.0"
description = "Autonomous cross-market Alpaca options research and execution agent"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "httpx>=0.27,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "alpaca-py>=0.42,<1",
  "mcp>=2,<3",
]

[project.scripts]
clockcross = "clockcross.main:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/clockcross"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["clockcross"]
ignore_missing_imports = true
